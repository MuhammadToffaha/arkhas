services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: arkhas:latest
    container_name: arkhas
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    env_file: .env
    shm_size: "1gb"            # Chromium needs shared memory
    volumes:
      # edit web/stores.json / synonyms.json without rebuilding (restart container after edit)
      - ./web:/srv/web:ro
