<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mach ich!</title>
<style>
:root{--bg:#F5F5F7;--bg2:#ECEDF3;--card:#FFFFFFCC;--solid:#fff;--ink:#0B0D17;--mut:#6B7180;--line:#E4E5EC;--brand:#5B5BF6;--brand2:#EEEEFF;--g1:#6D5BFF;--g2:#FF5E8A;--g3:#FFB547;--ok:#12B76A;--okbg:#E7F8EF;--bad:#F04438;--badbg:#FEECEB;--gold:#F79009;--goldbg:#FFF4E5;--r:24px;--sh:0 1px 2px #0000000a,0 8px 24px -12px #1b1b4b26}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B12;--bg2:#13131D;--card:#181824CC;--solid:#181824;--ink:#F2F2F7;--mut:#9A9DB0;--line:#2A2A3A;--brand:#8B8BFF;--brand2:#22224A;--okbg:#0F2E22;--badbg:#3A1515;--goldbg:#3A2A10;--sh:0 1px 0 #ffffff08 inset,0 10px 30px -14px #000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font:16px/1.5 "Inter",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg)}
body:before{content:"";position:fixed;inset:-20% -20% auto;height:60%;background:radial-gradient(40% 50% at 15% 20%,#6D5BFF33,transparent 70%),radial-gradient(35% 45% at 85% 10%,#FF5E8A2b,transparent 70%),radial-gradient(30% 40% at 60% 60%,#FFB54722,transparent 70%);filter:blur(10px);z-index:-1;pointer-events:none}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:14px 18px 8px;position:sticky;top:0}
#top h1{font-size:22px;margin:0;flex:1;font-weight:850;letter-spacing:-.6px}
#top h1 span{background:linear-gradient(90deg,#000 0 33%,#DD0000 33% 66%,#FFCE00 66%);width:22px;height:15px;display:inline-block;border-radius:4px;vertical-align:1px;margin-left:6px;box-shadow:0 0 0 1px #ffffff40}
.pill{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:750;font-size:14px}
.ib{border:0;background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:17px;padding:0}
#view{flex:1;overflow-y:auto;padding:4px 16px 110px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:var(--card);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--sh)}
#tabs button{flex:1;border:0;background:none;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border-radius:20px;font-weight:600}
#tabs button b{font-size:20px;font-weight:400}
#tabs button.on{color:var(--brand);background:var(--brand2)}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;font-size:20px;letter-spacing:-.4px}.card h3{margin:0 0 4px;font-size:16.5px;letter-spacing:-.2px}
h2{letter-spacing:-.5px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:13px}
.en{display:block;color:var(--mut);font-size:12.5px;font-weight:450;font-style:italic;margin-top:1px;line-height:1.35}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font-size:16px;font-weight:750;background:var(--ink);color:var(--bg);margin:8px 0;transition:transform .12s}
.btn:active,.opt:active,.chip:active,.day:active{transform:scale(.97)}
.btn.alt{background:var(--brand2);color:var(--brand)}.btn.ok{background:var(--ok);color:#fff}.btn.gold{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.btn:disabled{opacity:.4}
.btn .en,.opt .en{font-style:normal;opacity:.75}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));color:#fff;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff22}
.hero .mut,.hero .en{color:#ffffffd0}.hero .btn .en{color:#0B0D1799}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:10px;transition:width .5s}
.hero .bar{background:#ffffff40}.hero .bar i{background:#fff}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.bento .card{margin:0}.bento .wide{grid-column:span 2}
.big-n{font-size:30px;font-weight:850;letter-spacing:-1px;line-height:1.1}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.day{aspect-ratio:1;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:850;font-size:17px;color:var(--ink)}
.day small{font-size:10px;font-weight:600;color:var(--mut)}
.day.done{background:var(--okbg);border-color:var(--ok)}.day.cur{border:2px solid var(--brand);background:var(--brand2)}.day.ex{border-style:dashed}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--solid);border-radius:18px;padding:14px 16px;margin:8px 0;font-size:16px;color:var(--ink);font-weight:550}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input.t,textarea{width:100%;border:1.5px solid var(--line);border-radius:18px;padding:14px;font:inherit;background:var(--solid);color:var(--ink)}
textarea{min-height:180px;resize:vertical}
input.t:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--solid);color:var(--ink);border-radius:14px;padding:9px 12px;font-size:16px;font-weight:650;box-shadow:0 2px 0 var(--line)}
.chip.used{opacity:.2}
.ans{min-height:56px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.fb{border-radius:18px;padding:13px 14px;margin:10px 0;font-weight:650}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.gold{background:var(--goldbg);color:var(--gold)}
.fb .sm{color:var(--ink)}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;margin:10px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}table.g td{border-bottom:1px solid var(--line);padding:7px 8px}table.g tr:first-child td{background:var(--brand2);color:var(--brand);font-weight:750}table.g tr:last-child td{border-bottom:0}
.ex{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0}
.ex .de{font-weight:650}.say{border:0;background:var(--brand2);color:var(--brand);border-radius:12px;font-size:16px;padding:6px 9px;flex:none!important}
.flash{min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .big{font-size:30px;font-weight:850;margin:8px 0;letter-spacing:-.6px}
.steps{display:flex;gap:5px;margin:4px 0 10px}.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}.steps i.on{background:linear-gradient(90deg,var(--g1),var(--g2))}
.note{padding:8px 0;border-top:1px solid var(--line);font-size:14px}.note:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;background:var(--brand2);color:var(--brand)}
#toast{position:fixed;left:16px;right:16px;bottom:100px;background:var(--ink);color:var(--bg);border-radius:16px;padding:13px;text-align:center;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:9;font-weight:600}
#toast.on{opacity:.96;transform:none}
#modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:8}
#modal.on{display:flex}#modal>div{background:var(--solid);width:100%;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;animation:in .25s}
.entry{white-space:pre-wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:850}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 6px}
a{color:var(--brand)}
</style>
</head>
<body>
<div id="app">
  <div id="top"><h1 id="title">Mach ich!<span></span></h1><span class="pill" id="streak">🔥 0</span><span class="pill" id="xpp">⭐ 0</span><button class="ib" onclick="App.go('settings')">⚙️</button></div>
  <div id="view"></div>
  <nav id="tabs">
    <button data-t="home" onclick="App.go('home')"><b>🏠</b>Heute</button>
    <button data-t="plan" onclick="App.go('plan')"><b>📅</b>30 Tage</button>
    <button data-t="review" onclick="App.go('review')"><b>🔁</b>Review</button>
    <button data-t="leben" onclick="App.go('leben')"><b>✍️</b>Mein Leben</button>
    <button data-t="exam" onclick="App.go('exam')"><b>🏆</b>Prüfung</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)App.closeModal()"><div id="mbox"></div></div>
<script src="days1.js"></script>
<script src="days2.js"></script>
<script src="days3.js"></script>
<script src="exam.js"></script>
<script src="en.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
