<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mach ich!</title>
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#14213D;--mut:#6B7280;--line:#E5E7EB;--brand:#1F6FEB;--brand2:#E8F0FE;--ok:#16A34A;--okbg:#DCFCE7;--bad:#DC2626;--badbg:#FEE2E2;--gold:#F59E0B;--goldbg:#FEF3C7;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
#top h1{font-size:20px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.pill{background:var(--card);border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px;box-shadow:0 1px 2px #0001}
.ib{border:0;background:none;font-size:22px;padding:4px}
#view{flex:1;overflow-y:auto;padding:6px 16px 90px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;border:0;background:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
#tabs button b{font-size:21px;font-weight:400}
#tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 3px #0000000f}
.card h2{margin:0 0 6px;font-size:18px}.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;margin:8px 0}
.btn.alt{background:var(--brand2);color:var(--brand)}.btn.ok{background:var(--ok)}.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.hero{background:linear-gradient(135deg,#1F6FEB,#6A5CFF);color:#fff}
.hero .mut{color:#E0E7FF}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.hero .bar{background:#ffffff40}.hero .bar i{background:#fff}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:14px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.day small{font-size:10px;font-weight:600;color:var(--mut)}
.day.done{background:var(--okbg);border-color:var(--ok)}.day.cur{border-color:var(--brand);background:var(--brand2)}.day.ex{border-style:dashed}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;margin:7px 0;font-size:16px;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input.t,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:170px;resize:vertical}
input.t:focus,textarea:focus{outline:0;border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-size:16px;font-weight:600}
.chip.used{opacity:.25}
.ans{min-height:52px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:7px;padding:6px 0}
.fb{border-radius:14px;padding:12px;margin:8px 0;font-weight:600}.fb.ok{background:var(--okbg);color:#14532D}.fb.bad{background:var(--badbg);color:#7F1D1D}.fb.gold{background:var(--goldbg);color:#78350F}
table.g{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}table.g td{border:1px solid var(--line);padding:6px}table.g tr:first-child td{background:var(--brand2);font-weight:700}
.ex{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0}
.ex .de{font-weight:600}.say{border:0;background:var(--brand2);border-radius:10px;font-size:17px;padding:5px 8px;flex:none!important}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .big{font-size:28px;font-weight:800;margin:8px 0}
.steps{display:flex;gap:4px;margin:4px 0 8px}.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}.steps i.on{background:var(--brand)}
.note{padding:6px 0;border-top:1px solid var(--line);font-size:14px}.note:first-child{border-top:0}
.ring{width:84px;height:84px;flex:none!important}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--goldbg);color:#92400E}
#toast{position:fixed;left:16px;right:16px;bottom:84px;background:#111827;color:#fff;border-radius:12px;padding:12px;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:.95}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:8}
#modal.on{display:flex}#modal>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85%;overflow:auto}
.entry{white-space:pre-wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 6px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><h1 id="title">Mach ich! 🇩🇪</h1><span class="pill" id="streak">🔥 0</span><span class="pill" id="xpp">⭐ 0</span><button class="ib" onclick="App.go('settings')">⚙️</button></div>
  <div id="view"></div>
  <nav id="tabs">
    <button data-t="home" onclick="App.go('home')"><b>🏠</b>Heute</button>
    <button data-t="plan" onclick="App.go('plan')"><b>📅</b>30 Tage</button>
    <button data-t="review" onclick="App.go('review')"><b>🔁</b>Review</button>
    <button data-t="leben" onclick="App.go('leben')"><b>✍️</b>Mein Leben</button>
    <button data-t="exam" onclick="App.go('exam')"><b>🏆</b>Prüfung</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)App.closeModal()"><div id="mbox"></div></div>
<script src="days1.js"></script>
<script src="days2.js"></script>
<script src="days3.js"></script>
<script src="exam.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
