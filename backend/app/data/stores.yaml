# Egyptian online stores. Add a store = add a block, no code needed.
#
# search_url : {q} is replaced with the URL-encoded query
# lang       : which query to send: en | ar | both   (both = original + translation)
# render     : true = open with headless Chromium (for JavaScript-only sites)
# item       : CSS selector for one product card
# title/price/old_price/link/image : CSS selector inside the card. "sel@attr" reads an attribute.
# If CSS finds nothing, the engine falls back to JSON-LD / embedded JSON on the page.
#
# Store HTML changes over time. Run:  docker compose exec app python -m app.doctor "iphone 15"
# to see which stores return results, then fix selectors here.

- name: Amazon.eg
  search_url: "https://www.amazon.eg/s?k={q}&language=en_AE"
  search_url_ar: "https://www.amazon.eg/s?k={q}&language=ar_AE"
  base_url: "https://www.amazon.eg"
  lang: both
  item: 'div[data-component-type="s-search-result"]'
  title: "h2 span"
  price: "span.a-price:not(.a-text-price) span.a-offscreen"
  old_price: "span.a-price.a-text-price span.a-offscreen"
  link: "a.a-link-normal[href*='/dp/']@href"
  image: "img.s-image@src"

- name: Jumia
  search_url: "https://www.jumia.com.eg/catalog/?q={q}"
  base_url: "https://www.jumia.com.eg"
  lang: both
  item: "article.prd"
  title: ".name"
  price: ".prc"
  old_price: ".old"
  link: "a.core@href"
  image: "img.img@data-src"

- name: Noon
  search_url: "https://www.noon.com/egypt-en/search/?q={q}"
  search_url_ar: "https://www.noon.com/egypt-ar/search/?q={q}"
  base_url: "https://www.noon.com"
  lang: both
  render: true
  item: 'div[data-qa^="product-"], div[class*="ProductBoxLinkHandler"]'
  title: '[data-qa="product-name"], h2'
  price: 'strong[class*="amount"], [data-qa="price-now"]'
  old_price: '[class*="oldPrice"]'
  link: 'a[href*="/p/"]@href'
  image: "img@src"

- name: B.TECH
  search_url: "https://btech.com/en/catalogsearch/result/?q={q}"
  search_url_ar: "https://btech.com/ar/catalogsearch/result/?q={q}"
  base_url: "https://btech.com"
  lang: both
  render: true
  item: "li.product-item, div.product-item-info"
  title: ".product-item-link, .product-item-name"
  price: '[data-price-type="finalPrice"] .price, .special-price .price, .price'
  old_price: '[data-price-type="oldPrice"] .price'
  link: "a.product-item-link@href"
  image: "img.product-image-photo@src"

- name: 2B
  search_url: "https://2b.com.eg/en/catalogsearch/result/?q={q}"
  base_url: "https://2b.com.eg"
  lang: en
  item: "li.product-item"
  title: ".product-item-link"
  price: '[data-price-type="finalPrice"] .price'
  old_price: '[data-price-type="oldPrice"] .price'
  link: "a.product-item-link@href"
  image: "img.product-image-photo@src"

- name: Raya Shop
  search_url: "https://www.rayashop.com/en/catalogsearch/result/?q={q}"
  base_url: "https://www.rayashop.com"
  lang: en
  item: "li.product-item"
  title: ".product-item-link"
  price: '[data-price-type="finalPrice"] .price'
  old_price: '[data-price-type="oldPrice"] .price'
  link: "a.product-item-link@href"
  image: "img.product-image-photo@src"

- name: Carrefour Egypt
  search_url: "https://www.carrefouregypt.com/mafegy/en/search?keyword={q}"
  base_url: "https://www.carrefouregypt.com"
  lang: en
  render: true
  item: '[data-testid="product_card"], div[class*="ProductCard"]'
  title: '[data-testid="product_name"], a[href*="/p/"]'
  price: '[data-testid="product_price"], div[class*="price"]'
  link: 'a[href*="/p/"]@href'
  image: "img@src"

- name: Dubai Phone
  enabled: false   # enable after checking selectors with app.doctor
  search_url: "https://dubaiphone.net/en/catalogsearch/result/?q={q}"
  base_url: "https://dubaiphone.net"
  lang: en
  item: "li.product-item"
  title: ".product-item-link"
  price: '[data-price-type="finalPrice"] .price'
  link: "a.product-item-link@href"
  image: "img.product-image-photo@src"
