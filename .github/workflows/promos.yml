name: promos

# 🎟️ Daily: collect Egypt promo codes -> web/promos.json (the app syncs web/ files from GitHub).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/promos.py web/promos.json
      - name: Commit if changed
        run: |
          git config user.name "arkhas-promos"; git config user.email "noreply@anthropic.com"
          git add web/promos.json
          git diff --cached --quiet && echo "no change" || { git commit -qm "🎟️ promo codes update"; git push; }
