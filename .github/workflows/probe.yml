name: probe
on:
  workflow_dispatch:
    inputs:
      urls: { description: "space separated", required: true }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/probe.py ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "probe"; git config user.email "noreply@anthropic.com"
          git checkout --orphan probe-out && git rm -rqf --cached . && git add probe && git commit -qm probe && git push -f origin probe-out
