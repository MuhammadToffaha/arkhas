<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROWA Remote</title>
<style>
:root{
  --bg:#05060a;--g1:rgba(255,255,255,.055);--g2:rgba(255,255,255,.085);--g3:rgba(255,255,255,.13);--bd:rgba(255,255,255,.09);--hi:rgba(255,255,255,.14);
  --ink:#f5f6fb;--mut:#9095ab;--a1:#ff6a2b;--a2:#ff2e7e;--a3:#8b5cf6;
  --grad:linear-gradient(135deg,#ff6a2b 0%,#ff2e7e 55%,#a855f7 100%);--grad2:linear-gradient(135deg,#ff7a3d,#ff3d7f);
  --ok:#34e08a;--warn:#ffb83d;--bad:#ff5468;--r:28px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"Cairo",system-ui,"Noto Sans Arabic",sans-serif;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
/* aurora */
.aur{position:fixed;inset:-20%;z-index:-1;filter:blur(70px);opacity:.55;pointer-events:none}
.aur i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vw;height:55vw;background:#ff6a2b;top:2%;left:10%}
.aur i:nth-child(2){width:50vw;height:50vw;background:#ff2e7e;top:30%;right:0;animation-delay:-7s;opacity:.7}
.aur i:nth-child(3){width:60vw;height:60vw;background:#6d28d9;bottom:0;left:0;animation-delay:-14s;opacity:.6}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}
.aur:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.35),rgba(5,6,10,.85) 45%,rgba(5,6,10,.95))}
[hidden]{display:none!important}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ltr{direction:ltr}
.glass{background:var(--g1);border:1px solid var(--bd);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:inset 0 1px 0 var(--hi)}
/* header */
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:9px 14px 9px 10px;border-radius:24px}
.dot{width:40px;height:40px;border-radius:15px;display:grid;place-items:center;background:var(--g2);position:relative;flex:none}
.dot:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;bottom:-2px;inset-inline-end:-2px;background:var(--mut);border:2.5px solid #0c0d14}
.chip.ok .dot:after{background:var(--ok);box-shadow:0 0 12px var(--ok)}.chip.wait .dot:after{background:var(--warn);animation:bl 1s infinite}.chip.bad .dot:after{background:var(--bad)}
@keyframes bl{50%{opacity:.2}}
.chip b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.chip small{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:1px 7px;border-radius:99px;background:var(--g3);color:var(--ink)}
.tag.g{background:rgba(52,224,138,.14);color:var(--ok)}.tag.a{background:rgba(255,184,61,.15);color:var(--warn)}
.hb{width:52px;height:52px;border-radius:20px;display:grid;place-items:center;transition:transform .1s}
.hb.pw{color:#ff7186;background:rgba(255,84,104,.12);border-color:rgba(255,84,104,.25)}
.press{transform:scale(.92)!important;filter:brightness(1.35)}
.vol{display:flex;align-items:center;gap:8px;margin:4px 20px 0;color:var(--mut);font-size:11px}
.vol .t{flex:1;height:4px;border-radius:4px;background:var(--g2);overflow:hidden}.vol .t i{display:block;height:100%;background:var(--grad);transition:width .3s}
.ban{margin:8px 16px 0;padding:12px 14px;border-radius:20px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.ban .t{flex:1;line-height:1.45}.ban.bad{background:rgba(255,84,104,.09);border-color:rgba(255,84,104,.22)}.ban.warn{background:rgba(255,184,61,.09);border-color:rgba(255,184,61,.24)}
/* pages */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 118px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.page{display:none}.page.on{display:block;animation:fd .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0;transform:translateY(10px) scale(.99)}}
.k{position:relative;border-radius:22px;background:var(--g1);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:60px;font-size:20px;font-weight:700;transition:transform .1s,background .15s;touch-action:none;color:#e4e7f2;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.k small{font-size:10.5px;font-weight:600;color:var(--mut);line-height:1.1}
.k.acc{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 14px 34px -10px rgba(255,46,126,.65),inset 0 1px 0 rgba(255,255,255,.3)}.k.acc small{color:#fff}
.k.press{background:var(--g3)}
.grid{display:grid;gap:10px;margin:12px 0}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
/* d-pad orb */
.pad{position:relative;width:min(82vw,318px);aspect-ratio:1;margin:16px auto 8px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.10),rgba(255,255,255,.03) 60%),rgba(15,16,26,.6);border:1px solid var(--bd);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 40px 80px -30px #000,inset 0 1px 0 var(--hi),inset 0 -20px 40px rgba(0,0,0,.35)}
.pad:before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:2px;background:conic-gradient(from 210deg,transparent,rgba(255,106,43,.6),rgba(255,46,126,.6),rgba(139,92,246,.5),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7}
.pad .k{position:absolute;background:transparent;border:0;box-shadow:none;border-radius:50%;color:#d2d6e6;min-height:0;backdrop-filter:none}
.pad .k .i{width:34px;height:34px;stroke-width:2.4}
.pad .k.press{background:rgba(255,255,255,.07)}
.pad .u{top:3%;left:30%;width:40%;height:28%}.pad .d{bottom:3%;left:30%;width:40%;height:28%}
.pad .l{left:3%;top:30%;width:28%;height:40%}.pad .r{right:3%;top:30%;width:28%;height:40%}
.pad .ok{left:31%;top:31%;width:38%;height:38%;background:var(--grad);color:#fff;font-size:19px;font-weight:900;letter-spacing:1.5px;box-shadow:0 16px 40px -8px rgba(255,46,126,.75),inset 0 2px 0 rgba(255,255,255,.3)}
.pad .ok.press{transform:scale(.93);background:var(--grad)}
.side{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:12px}
.rock{display:flex;flex-direction:column;border-radius:30px;overflow:hidden}
.rock .k{flex:1;border:0;border-radius:0;background:transparent;box-shadow:none;min-height:64px;backdrop-filter:none}
.rock .lb{text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--mut)}
.mid{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.tp{height:min(58vh,430px);border-radius:32px;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13.5px;padding:24px;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05),transparent 70%),repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.03) 0 1px,transparent 1px 36px),var(--g1)}
.tp i{position:absolute;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,126,.6),transparent 70%);pointer-events:none;transition:opacity .35s}
.card{border-radius:var(--r);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .t small{color:var(--mut);font-size:12px}
.btn{font-weight:800;font-size:14.5px;border-radius:18px;padding:13px 16px;background:var(--grad);color:#fff;box-shadow:0 12px 30px -10px rgba(255,46,126,.6),inset 0 1px 0 rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--g2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi);border:1px solid var(--bd)}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:14px}
.btn.wide{width:100%}.btn:disabled{opacity:.45}
.inp{width:100%;font:inherit;font-size:16px;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--bd);border-radius:18px;padding:13px 15px;outline:none}
.inp:focus{border-color:rgba(255,46,126,.6);box-shadow:0 0 0 4px rgba(255,46,126,.12)}
.flex{display:flex;gap:8px;align-items:center}.flex>.inp{flex:1}
.mut{color:var(--mut);font-size:12.5px;line-height:1.6}
.seg{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:16px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:13px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff}
.sw{position:relative;display:inline-block;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:15px;background:var(--g3);transition:.2s}
.sw i:before{content:"";position:absolute;width:24px;height:24px;top:3px;inset-inline-start:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px #0005}
.sw input:checked+i{background:var(--grad)}.sw input:checked+i:before{transform:translateX(20px)}[dir=rtl] .sw input:checked+i:before{transform:translateX(-20px)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bar{height:5px;border-radius:5px;background:var(--g2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.doc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.doc div{background:rgba(0,0,0,.25);border-radius:16px;padding:9px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.doc .y{color:var(--ok)}.doc .n{color:var(--bad)}
.steps{margin:8px 0 0;padding-inline-start:20px;font-size:13px;line-height:1.75}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.app{border-radius:24px;padding:16px 6px 12px;text-align:center;transition:transform .1s}
.app:active{transform:scale(.95)}
.app .e{font-size:30px;line-height:1.1}.app b{display:block;font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.add{border-style:dashed;background:transparent;color:var(--mut);box-shadow:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tool{border-radius:24px;padding:14px;text-align:start;display:flex;gap:10px;align-items:center}
.tool .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.tool b{font-size:13.5px;display:block}.tool small{color:var(--mut);font-size:11px}
.pk .t b{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;direction:ltr;text-align:start}
.cl{min-height:44px;border-radius:18px;border:0}
nav{position:fixed;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(5,1fr);border-radius:30px;padding:7px;z-index:10;background:rgba(18,19,30,.6)}
nav .ind{position:absolute;top:7px;bottom:7px;border-radius:23px;background:var(--g3);transition:left .3s cubic-bezier(.3,1.3,.5,1),right .3s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 1px 0 var(--hi)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);padding:8px 0 6px;border-radius:23px;transition:color .2s}
nav button small{font-size:10.5px;font-weight:700}
nav button.on{color:#fff}nav button.on .i{color:#ff6f9c}
.scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fdi .2s}
@keyframes fdi{from{opacity:0}}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:30;background:rgba(18,19,30,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--bd);border-radius:32px 32px 0 0;padding:10px 18px 24px;box-shadow:0 -20px 60px #000;animation:up .3s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--g3);margin:0 auto 14px}
@keyframes up{from{transform:translateY(60%);opacity:.3}}
.sheet h3{margin:0 0 8px;font-size:17px}
.pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px}
.popbox{border-radius:30px;padding:24px 18px 16px;max-width:340px;width:100%;text-align:center;animation:pin .3s cubic-bezier(.2,1.4,.4,1);background:rgba(22,23,36,.92)}
.popbox .e{font-size:44px;line-height:1.1}.popbox b{display:block;font-size:18px;margin:8px 0 4px}
.popb{display:flex;gap:8px;margin-top:16px}.popb .btn{flex:1}
@keyframes pin{from{transform:scale(.85);opacity:0}}
.code{font-family:ui-monospace,monospace;font-size:34px;letter-spacing:12px;text-align:center;text-transform:uppercase;direction:ltr;padding:16px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.credit{text-align:center;color:var(--mut);font-size:12px;margin:20px 0 6px;opacity:.8}
.shot{width:100%;border-radius:16px;border:1px solid var(--bd);display:block;background:#000;min-height:120px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--g3);border-top-color:#ff3d7f;animation:rot .8s linear infinite;display:inline-block;vertical-align:middle}
.spin.s{width:14px;height:14px;border-width:2px}
@keyframes rot{to{transform:rotate(360deg)}}
/* ---------- first-time setup ---------- */
#setup{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:18px 20px 22px;overflow-y:auto;background:radial-gradient(90% 45% at 50% 18%,rgba(255,46,126,.28),transparent 70%),radial-gradient(80% 40% at 0% 100%,rgba(139,92,246,.22),transparent 70%),radial-gradient(70% 35% at 100% 70%,rgba(255,106,43,.16),transparent 70%),#06070c}
.sTop{display:flex;align-items:center;justify-content:space-between}
.sTop .brand{font-weight:900;font-size:15px;letter-spacing:.5px;display:flex;gap:8px;align-items:center}
.sTop .brand i{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:14px}
.prog{display:flex;gap:6px;margin:18px 0 6px}.prog i{flex:1;height:5px;border-radius:5px;background:var(--g2);transition:background .4s}.prog i.on{background:var(--grad)}
.hero{display:grid;place-items:center;margin:20px 0 10px;position:relative;height:150px}
.hero .tv{width:150px;height:96px;border-radius:18px;border:3px solid rgba(255,255,255,.75);position:relative;display:grid;place-items:center;background:rgba(255,255,255,.04);box-shadow:0 0 60px -10px rgba(255,46,126,.6),inset 0 0 30px rgba(255,46,126,.15)}
.hero .tv:after{content:"";position:absolute;bottom:-16px;width:50px;height:5px;border-radius:5px;background:rgba(255,255,255,.6)}
.hero .ring{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,46,126,.45);animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
.hero .ring:nth-child(2){animation-delay:.7s}.hero .ring:nth-child(3){animation-delay:1.4s}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.9);opacity:0}}
.hero.still .ring{display:none}
.hero .big{font-size:40px}
#setup h1{font-size:27px;line-height:1.2;margin:8px 0 6px;letter-spacing:-.4px;text-align:center}
#setup .lead{color:var(--mut);font-size:14px;line-height:1.6;text-align:center;margin:0 auto 16px;max-width:340px}
#setup .body{flex:1}
</style>
</head>

<svg width="0" height="0" style="position:absolute">

 <symbol id="i-remote" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3.5"/><circle cx="12" cy="8" r="2.2"/><path d="M10 14h.01M14 14h.01M10 17.5h.01M14 17.5h.01"/></symbol>

/* ---------- keys: tap · hold-to-repeat · long-press ---------- */
function bindKeys(root = document){
  root.querySelectorAll('[data-k]').forEach(b => {
    if (b._b) return; b._b = 1;
    const k = +b.dataset.k, rep = 'rep' in b.dataset, lng = 'long' in b.dataset;
    let t1, t2, longOn = false, down = false;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); try{ b.setPointerCapture(e.pointerId) }catch(_){}
      down = true; b.classList.add('press');
      if (lng) { longOn = false; t1 = setTimeout(() => { longOn = true; R.keyDown(k) }, 450) }
      else { R.key(k); if (rep) t1 = setTimeout(() => { t2 = setInterval(() => R.repeat(k), 250) }, 450) }
    });
    const up = () => { if (!down) return; down = false; b.classList.remove('press'); clearTimeout(t1); clearInterval(t2);
      if (lng) { if (longOn) R.keyUp(k); else R.key(k) } };
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  });
}

/* ---------- touchpad ---------- */
(() => {
  const tp = $('#tp'), STEP = 42; let x0, y0, moved, lt, longOn, dot;
  tp.addEventListener('pointerdown', e => {
    e.preventDefault(); try{ tp.setPointerCapture(e.pointerId) }catch(_){}
    x0 = e.clientX; y0 = e.clientY; moved = false; longOn = false;
    dot = document.createElement('i'); tp.appendChild(dot); place(e);
    lt = setTimeout(() => { if (!moved) { longOn = true; R.keyDown(23) } }, 600);
  });
  const place = e => { const r = tp.getBoundingClientRect(); dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px' };
  tp.addEventListener('pointermove', e => {
    if (x0 == null || longOn) return; place(e);
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < STEP) return;
    moved = true; clearTimeout(lt);
    R.key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 22 : 21) : (dy > 0 ? 20 : 19));
    x0 = e.clientX; y0 = e.clientY;
  });
  const end = () => { if (x0 == null) return; clearTimeout(lt);
    if (longOn) R.keyUp(23); else if (!moved) R.key(23);
    x0 = null; if (dot) { const d = dot; d.style.opacity = 0; setTimeout(() => d.remove(), 350) } };
  ['pointerup','pointercancel'].forEach(ev => tp.addEventListener(ev, end));
})();

}

    B.innerHTML = `<div class="card glass" style="margin-top:0">${foundList()}
      ${S.scanning ? `<div class="bar"><i style="width:${Math.max(5, S.scanPct)}%"></i></div>` : `<button class="btn alt wide" style="margin-top:12px" onclick="R.scan()">${t('scan')}</button>`}

  const busy = S.upStatus === 'downloading' || S.upStatus === 'installing';
  $('#verS').textContent = S.update ? `🆕 ${t('latest')}: 1.0.${S.latest}` : (S.upError ? '⚠️ ' + S.upError : S.latest ? t('uptodate') : '');
  $('#upBtn').textContent = busy ? (S.upPct >= 0 ? S.upPct + '%' : '…') : S.update ? t('updateNow') : (S.upStatus === 'checking' ? '…' : t('check'));
  $('#upBtn').disabled = busy; $('#upBtn').onclick = () => S.update ? R.installUpdate() : R.checkUpdate();
  $('#upBar').hidden = !busy; $('#upBarI').style.width = Math.max(0, S.upPct) + '%';
  $('#credV').textContent = S.version;
}
$('#scanBtn').onclick = () => R.scan();
$('#docBtn').onclick = () => { R.doctor(); go('remote') };
$$('#seg button').forEach(b => b.onclick = () => { S.method = b.dataset.m; R.setPref('method', b.dataset.m); renderSet() });
$('#pairBtn').onclick = () => { prHidden = false; R.pair() };
$('#ipBtn').onclick = () => manualIp('#ip');
$('#langBtn').onclick = () => { L = L === 'ar' ? 'en' : 'ar'; R.setPref('lang', L); applyLang(); render(); renderApps() };
$('#keyBtn').onclick = () => { if (confirm(t('newkeyhint') + '?')) { prHidden = false; R.resetKey() } };

/* ---------- update pop-up (once per open) ---------- */
let popShown = false;
function renderPop(){
  if (popShown || !S.update || setupOn()) return; popShown = true;
  $('#upPopT').textContent = `${t('newVer')} 1.0.${S.latest}`; $('#upPopS').textContent = `${t('current')}: ${S.version}`;
  $('#upLater').textContent = t('later'); $('#upNow').textContent = t('updateNow'); $('#upPop').hidden = false;
}
$('#upLater').onclick = () => $('#upPop').hidden = true;
$('#upNow').onclick = () => { $('#upPop').hidden = true; R.installUpdate(); go('set') };

/* ---------- state ---------- */
function render(){
  if (S.status !== lastStatus) {
    if (S.status === 'needpair' && lastStatus !== 'code' && lastStatus !== 'pairing') prHidden = false;
    if (S.status !== 'code' && $('#codeIn')) $('#pr').innerHTML = '';
  }
  renderTop(); renderSetup(); renderPair(); if (page === 'set') renderSet(); renderPop(); wizState();
  if (!setupOn() && S.status === 'connected' && S.mode === 'atv' && !S.wiz && !render._probed) { render._probed = 1; setTimeout(() => R.probeAdb(), 1500) }
  const a = JSON.stringify(S.apps); if (a !== render._apps) { render._apps = a; renderApps() }
  lastStatus = S.status;
}
window.onRowa = s => { S = s; render() };
window.rowaBack = () => {
  if (!$('#upPop').hidden) { $('#upPop').hidden = true; return true }
  if (SHEETS.some(s => !$(s).hidden)) { closeSheets(); return true }
  if (!$('#pr').hidden) { prHidden = true; if (S.status === 'code') R.cancelPair(); renderPair(); return true }
  if (page !== 'remote') { go('remote'); return true }
  return false;
};
applyLang(); bindKeys(); render(); setTimeout(moveInd, 50);

</script>
</body>
