<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROWA Remote</title>
<style>
:root{
  --bg:#07080d;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.075);--s3:rgba(255,255,255,.11);--bd:rgba(255,255,255,.07);
  --ink:#f2f4fa;--mut:#8a90a6;--acc:#ff5a1f;--acc2:#ff9a3c;--grad:linear-gradient(135deg,#ff4d1a,#ff9a3c);
  --ok:#2bd67b;--warn:#ffb020;--bad:#ff4d5e;--r:22px;--glow:0 10px 30px -8px rgba(255,90,31,.55)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"Cairo",system-ui,"Noto Sans Arabic",sans-serif;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,90,31,.16),transparent 60%),radial-gradient(90% 50% at 100% 110%,rgba(120,80,255,.10),transparent 60%),var(--bg)}
[hidden]{display:none!important}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.ltr{direction:ltr}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:18px;background:var(--s1);border:1px solid var(--bd);backdrop-filter:blur(14px)}
.tvic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--s2);position:relative;flex:none}
.tvic:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;bottom:-2px;inset-inline-end:-2px;background:var(--mut);border:2px solid #10121a}
.chip.ok .tvic:after{background:var(--ok);box-shadow:0 0 10px var(--ok)}.chip.wait .tvic:after{background:var(--warn);animation:bl 1s infinite}.chip.bad .tvic:after{background:var(--bad)}
@keyframes bl{50%{opacity:.25}}
.chip b{display:block;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
.tag{font-size:10px;font-weight:800;letter-spacing:.4px;padding:1px 7px;border-radius:99px;background:var(--s3);color:var(--ink)}
.tag.g{background:rgba(43,214,123,.15);color:var(--ok)}.tag.a{background:rgba(255,154,60,.16);color:var(--acc2)}
.hb{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--bd);transition:transform .08s}
.hb.pw{color:#ff6b6b;background:rgba(255,77,94,.10);border-color:rgba(255,77,94,.2)}
.press{transform:scale(.93)!important;filter:brightness(1.3)}
.vol{display:flex;align-items:center;gap:8px;margin:2px 18px 0;color:var(--mut);font-size:11px}
.vol .t{flex:1;height:4px;border-radius:4px;background:var(--s2);overflow:hidden}.vol .t i{display:block;height:100%;background:var(--grad);transition:width .25s}
/* ---------- banners ---------- */
.ban{margin:8px 16px 0;padding:12px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--bd);font-size:13.5px;display:flex;gap:10px;align-items:center}
.ban .t{flex:1;line-height:1.45}.ban.bad{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.18)}.ban.warn{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.2)}
/* ---------- pages ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 110px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.page{display:none}.page.on{display:block;animation:fd .22s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.k{position:relative;border-radius:20px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:58px;font-size:20px;font-weight:700;transition:transform .08s,background .15s;touch-action:none;color:#dfe3ef}
.k small{font-size:10.5px;font-weight:600;color:var(--mut);line-height:1.1}
.k.acc{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}.k.acc small{color:#fff}
.k.press{background:var(--s3)}
.grid{display:grid;gap:10px;margin:12px 0}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
/* d-pad */
.pad{position:relative;width:min(80vw,310px);aspect-ratio:1;margin:14px auto 6px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1d2130,#11131c 72%);border:1px solid var(--bd);
  box-shadow:0 30px 60px -20px #000,inset 0 1px 0 rgba(255,255,255,.08),inset 0 -12px 30px rgba(0,0,0,.4)}
.pad:before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(255,255,255,.05)}
.pad .k{position:absolute;background:transparent;border:0;border-radius:50%;color:#c9cede;min-height:0}
.pad .k .i{width:34px;height:34px;stroke-width:2.4}
.pad .k.press{background:rgba(255,255,255,.06)}
.pad .u{top:3%;left:30%;width:40%;height:28%}.pad .d{bottom:3%;left:30%;width:40%;height:28%}
.pad .l{left:3%;top:30%;width:28%;height:40%}.pad .r{right:3%;top:30%;width:28%;height:40%}
.pad .ok{left:31%;top:31%;width:38%;height:38%;background:var(--grad);color:#fff;font-size:18px;font-weight:900;letter-spacing:1px;box-shadow:0 12px 34px -6px rgba(255,90,31,.7),inset 0 2px 0 rgba(255,255,255,.25)}
.pad .ok.press{transform:scale(.94);background:var(--grad)}
.side{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:12px}
.rock{display:flex;flex-direction:column;border-radius:26px;background:var(--s1);border:1px solid var(--bd);overflow:hidden}
.rock .k{flex:1;border:0;border-radius:0;background:transparent;min-height:62px}
.rock .lb{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--mut)}
.mid{display:grid;grid-template-rows:1fr 1fr;gap:10px}
/* touchpad */
.tp{height:min(58vh,430px);border-radius:28px;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13.5px;padding:24px;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.04),transparent 70%),repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.025) 0 1px,transparent 1px 34px),var(--s1);border:1px solid var(--bd)}
.tp i{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.55),transparent 70%);pointer-events:none;transition:opacity .35s}
/* cards */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .t small{color:var(--mut);font-size:12px}
.btn{font-weight:800;font-size:14.5px;border-radius:15px;padding:12px 16px;background:var(--grad);color:#fff;box-shadow:var(--glow);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--s2);color:var(--ink);box-shadow:none;border:1px solid var(--bd)}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:12px}
.btn.wide{width:100%}.btn:disabled{opacity:.45}
.inp{width:100%;font:inherit;font-size:16px;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--bd);border-radius:15px;padding:12px 14px;outline:none}
.inp:focus{border-color:rgba(255,90,31,.6)}
.flex{display:flex;gap:8px;align-items:center}.flex>.inp{flex:1}
.mut{color:var(--mut);font-size:12.5px;line-height:1.55}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff}
.sw{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:14px;background:var(--s3);transition:.2s}
.sw i:before{content:"";position:absolute;width:22px;height:22px;top:3px;inset-inline-start:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--grad)}.sw input:checked+i:before{transform:translateX(20px)}[dir=rtl] .sw input:checked+i:before{transform:translateX(-20px)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bar{height:5px;border-radius:5px;background:var(--s2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--grad);transition:width .3s}
/* doctor */
.doc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.doc div{background:rgba(0,0,0,.22);border-radius:14px;padding:9px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.doc .y{color:var(--ok)}.doc .n{color:var(--bad)}
.steps{margin:8px 0 0;padding-inline-start:20px;font-size:13px;line-height:1.7}
/* apps */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.app{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:16px 6px 12px;text-align:center;transition:transform .08s}
.app:active{transform:scale(.95)}
.app .e{font-size:30px;line-height:1.1}.app b{display:block;font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.add{border-style:dashed;background:transparent;color:var(--mut)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tool{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:14px;text-align:start;display:flex;gap:10px;align-items:center}
.tool .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.tool b{font-size:13.5px;display:block}.tool small{color:var(--mut);font-size:11px}
.pk .t b{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;direction:ltr;text-align:start}
.cl{min-height:42px;border-radius:15px;border:0}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,20,30,.78);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:24px;padding:7px;box-shadow:0 20px 40px -10px #000;z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);padding:7px 0 5px;border-radius:17px;transition:.15s}
nav button small{font-size:10.5px;font-weight:700}
nav button.on{color:#fff;background:var(--s2)}nav button.on .i{color:var(--acc2)}
/* sheets */
.scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fdi .2s}
@keyframes fdi{from{opacity:0}}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#121520;border-top:1px solid var(--bd);border-radius:28px 28px 0 0;padding:10px 18px 22px;box-shadow:0 -20px 50px #000;animation:up .25s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--s3);margin:0 auto 14px}
@keyframes up{from{transform:translateY(60%);opacity:.3}}
.sheet h3{margin:0 0 8px;font-size:17px}
.pop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.popbox{background:#151925;border:1px solid var(--bd);border-radius:26px;padding:22px 18px 16px;max-width:340px;width:100%;text-align:center;animation:pin .28s cubic-bezier(.2,1.4,.4,1)}
.popbox .e{font-size:44px;line-height:1.1}.popbox b{display:block;font-size:18px;margin:8px 0 4px}
.popb{display:flex;gap:8px;margin-top:16px}.popb .btn{flex:1}
@keyframes pin{from{transform:scale(.85);opacity:0}}
.code{font-family:ui-monospace,monospace;font-size:32px;letter-spacing:12px;text-align:center;text-transform:uppercase;direction:ltr;padding:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.credit{text-align:center;color:var(--mut);font-size:12px;margin:20px 0 6px;opacity:.8}
.shot{width:100%;border-radius:14px;border:1px solid var(--bd);display:block;background:#000;min-height:120px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--acc);animation:rot .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
 <symbol id="i-kb" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>

 <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>

<header>
  <div class="chip" id="chip">
    <div class="tvic"><svg class="i"><use href="#i-tv"/></svg></div>
    <div style="min-width:0;flex:1"><b id="tvName">ROWA</b><small><span id="tvSub"></span><span class="tag" id="tvTag" hidden></span></small></div>
  </div>
  <button class="hb" id="kbBtn" aria-label="keyboard"><svg class="i"><use href="#i-kb"/></svg></button>
  <button class="hb pw k" data-k="26" data-long aria-label="power"><svg class="i"><use href="#i-power"/></svg></button>
</header>
<div class="vol" id="vol" hidden><svg class="i" style="width:15px;height:15px"><use href="#i-voldn"/></svg><div class="t"><i id="volI"></i></div><span id="volN"></span></div>
<div class="ban" id="ban" hidden><span id="banE" style="font-size:20px">📡</span><div class="t" id="banT"></div><button class="btn sm alt" id="banB"></button></div>

<main>
  <!-- 🎮 remote -->
  <section class="page on" id="p-remote">
    <div id="hero"></div>
    <div class="grid g4 ltr">
      <button class="k" data-k="178"><svg class="i"><use href="#i-input"/></svg><small data-t="input"></small></button>
      <button class="k" data-k="176"><svg class="i"><use href="#i-gear"/></svg><small data-t="tvset"></small></button>
      <button class="k" data-k="284"><svg class="i"><use href="#i-grid"/></svg><small data-t="allapps"></small></button>
      <button class="k" data-k="84"><svg class="i"><use href="#i-search"/></svg><small data-t="search"></small></button>
    </div>
    <div class="pad ltr">
      <button class="k u" data-k="19" data-rep><svg class="i"><use href="#i-up"/></svg></button>
      <button class="k l" data-k="21" data-rep><svg class="i"><use href="#i-left"/></svg></button>
      <button class="k ok" data-k="23" data-long>OK</button>
      <button class="k r" data-k="22" data-rep><svg class="i"><use href="#i-right"/></svg></button>
      <button class="k d" data-k="20" data-rep><svg class="i"><use href="#i-down"/></svg></button>
    </div>
    <div class="grid g3 ltr">
      <button class="k" data-k="4" data-long><svg class="i"><use href="#i-back"/></svg><small data-t="back"></small></button>
      <button class="k" data-k="3" data-long><svg class="i"><use href="#i-home"/></svg><small data-t="home"></small></button>
      <button class="k" data-k="82"><svg class="i"><use href="#i-menu"/></svg><small data-t="menu"></small></button>
    </div>
    <div class="side ltr">
      <div class="rock">
        <button class="k" data-k="24" data-rep><svg class="i"><use href="#i-volup"/></svg></button>
        <div class="lb">VOL</div>

/* ---------- keys: tap · hold-to-repeat · long-press ---------- */
function bindKeys(root = document){
  root.querySelectorAll('[data-k]').forEach(b => {
    if (b._b) return; b._b = 1;
    const k = +b.dataset.k, rep = 'rep' in b.dataset, lng = 'long' in b.dataset;
    let t1, t2, longOn = false, down = false;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); try{ b.setPointerCapture(e.pointerId) }catch(_){}
      down = true; b.classList.add('press');
      if (lng) { longOn = false; t1 = setTimeout(() => { longOn = true; R.keyDown(k) }, 450) }
      else { R.key(k); if (rep) t1 = setTimeout(() => { t2 = setInterval(() => R.repeat(k), 120) }, 400) }
    });
    const up = () => { if (!down) return; down = false; b.classList.remove('press'); clearTimeout(t1); clearInterval(t2);
      if (lng) { if (longOn) R.keyUp(k); else R.key(k) } };
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  });
}

/* ---------- touchpad ---------- */
(() => {
  const tp = $('#tp'), STEP = 42; let x0, y0, moved, lt, longOn, dot;
  tp.addEventListener('pointerdown', e => {
    e.preventDefault(); try{ tp.setPointerCapture(e.pointerId) }catch(_){}
    x0 = e.clientX; y0 = e.clientY; moved = false; longOn = false;
    dot = document.createElement('i'); tp.appendChild(dot); place(e);
    lt = setTimeout(() => { if (!moved) { longOn = true; R.keyDown(23) } }, 600);
  });
  const place = e => { const r = tp.getBoundingClientRect(); dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px' };
  tp.addEventListener('pointermove', e => {
    if (x0 == null || longOn) return; place(e);
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < STEP) return;
    moved = true; clearTimeout(lt);
    R.key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 22 : 21) : (dy > 0 ? 20 : 19));
    x0 = e.clientX; y0 = e.clientY;
  });
  const end = () => { if (x0 == null) return; clearTimeout(lt);
    if (longOn) R.keyUp(23); else if (!moved) R.key(23);
    x0 = null; if (dot) { const d = dot; d.style.opacity = 0; setTimeout(() => d.remove(), 350) } };
  ['pointerup','pointercancel'].forEach(ev => tp.addEventListener(ev, end));
})();

/* ---------- nav ---------- */
let page = 'remote';
function go(p){ page = p; $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); $$('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + p)); $('main').scrollTop = 0; if (p === 'set') renderSet() }
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.p));

/* ---------- sheets ---------- */
const SHEETS = ['#kb','#addApp','#mgr','#shotS'];
function openSheet(id){ SHEETS.forEach(s => $(s).hidden = s !== id); $('#scrim').hidden = false }
function closeSheets(){ SHEETS.forEach(s => $(s).hidden = true); $('#scrim').hidden = !!$('#pr').hidden; $('#kbIn').blur() }
$('#scrim').onclick = () => { if (!$('#pr').hidden && S.status !== 'pairing') { prHidden = true; if (S.status === 'code') R.cancelPair(); renderPair() } closeSheets() };

/* ---------- keyboard ---------- */
let kbT;
function openKb(txt){ openSheet('#kb'); const i = $('#kbIn'); if (txt != null) i.value = txt; $('#kbHint').textContent = S.mode === 'adb' ? t('kbhintD') : t('kbhintA'); setTimeout(() => i.focus(), 80) }
$('#kbBtn').onclick = () => openKb();
$('#kbX').onclick = closeSheets;
$('#kbIn').addEventListener('input', () => { clearTimeout(kbT); kbT = setTimeout(() => R.text($('#kbIn').value), 140) });
$('#kbIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); R.key(66) } });
$('#kbClr').onclick = () => { R.clearText(); $('#kbIn').value = '' };
window.onIme = txt => { if (S.autoKb && $('#kb').hidden) openKb(txt) };

/* ---------- apps ---------- */
const DEF = [['▶️','YouTube','com.google.android.youtube.tv'],['🎬','Netflix','com.netflix.ninja'],['👶','YouTube Kids','com.google.android.youtube.tvkids'],['🛒','Play Store','com.android.vending'],
  ['🎵','Spotify','com.spotify.tv.android'],['📦','Prime Video','com.amazon.amazonvideo.livingroom'],['✨','Disney+','com.disney.disneyplus'],['⚙️','Settings','com.android.tv.settings']];
const apps = () => Array.isArray(S.apps) ? S.apps : DEF;
const linkOf = p => p.includes('://') ? p : 'market://launch?id=' + p;
function renderApps(){
  $('#apps').innerHTML = apps().map(([e,n], i) => `<button class="app" data-i="${i}"><div class="e">${esc(e)}</div><b>${esc(n)}</b></button>`).join('')
    + `<button class="app add" id="addBtn"><div class="e">＋</div><b>${t('addapp')}</b></button>`;
  $$('#apps .app[data-i]').forEach(b => {
    let lt, longOn = false;
    b.addEventListener('pointerdown', () => { longOn = false; lt = setTimeout(() => { longOn = true; delApp(+b.dataset.i) }, 650) });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(lt)));
    b.addEventListener('click', () => { if (!longOn) R.launch(linkOf(apps()[+b.dataset.i][2])) });
  });
  $('#addBtn').onclick = () => { $('#aN').value = ''; $('#aP').value = ''; $('#aE').value = '📺';
    $('#aCur').hidden = !S.app; $('#aCur').textContent = t('addCur') + (S.app ? ' · ' + S.app : ''); openSheet('#addApp') };
}
function saveApps(a){ S.apps = a; R.setPref('apps', JSON.stringify(a)); renderApps() }
function delApp(i){ const a = apps().slice(); if (confirm(t('del') + ' ' + a[i][1] + '?')) { a.splice(i, 1); saveApps(a) } }
$('#aCur').onclick = () => { $('#aP').value = S.app; if (!$('#aN').value) $('#aN').value = S.app.split('.').pop() };
$('#aX').onclick = closeSheets;
$('#aOk').onclick = () => { const p = $('#aP').value.trim(); if (!p) return $('#aP').focus();
  saveApps([...apps(), [$('#aE').value.trim() || '📺', $('#aN').value.trim() || p.split('.').pop(), p]]); closeSheets() };

/* ---------- 🧹 TV app manager (ADB) ---------- */
let PK = null, pkF = 'user';
$('#tMgr').onclick = () => { openSheet('#mgr'); PK = null; renderPk(); R.packages() };
window.onPkgs = list => { PK = list === null ? 'na' : list; renderPk() };
window.onPkgDone = () => R.packages();
$$('#pkSeg button').forEach(b => b.onclick = () => { pkF = b.dataset.f; $$('#pkSeg button').forEach(x => x.classList.toggle('on', x === b)); renderPk() });
$('#pkF').addEventListener('input', () => renderPk());
function renderPk(){
  const box = $('#pkList');
  if (PK === null) { box.innerHTML = `<p class="mut"><span class="spin"></span> ${t('loading')}</p>`; return }
  if (PK === 'na') { box.innerHTML = `<p class="mut">${t('needAdb')}</p>`; return }
  const q = $('#pkF').value.trim().toLowerCase();
  const l = PK.filter(p => (pkF === 'off' ? p.off : pkF === 'sys' ? p.sys && !p.off : !p.sys && !p.off) && (!q || p.p.toLowerCase().includes(q)));
  box.innerHTML = l.slice(0, 250).map(p => `<div class="li pk"><div class="t"><b>${esc(p.p)}</b></div>
    ${p.off ? `<button class="btn sm" data-a="on" data-p="${esc(p.p)}">${t('enable')}</button>`
      : `<button class="btn sm alt" data-a="open" data-p="${esc(p.p)}">${t('open')}</button>
         <button class="btn sm alt" data-a="${p.sys ? 'off' : 'del'}" data-p="${esc(p.p)}">${p.sys ? t('disable') : t('uninstall')}</button>`}</div>`).join('') || `<p class="mut">—</p>`;
  box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a, p = b.dataset.p;
    if ((a === 'off' || a === 'del') && !confirm(`${a === 'off' ? t('disable') : t('uninstall')} ${p} — ${t('sure')}`)) return;
    b.disabled = true; b.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px"></span>'; R.pkg(p, a) });
}

/* ---------- 📸 screenshot ---------- */
$('#tShot').onclick = () => { openSheet('#shotS'); shot() };
$('#shotR').onclick = shot; $('#shotX').onclick = closeSheets;
function shot(){ $('#shotBox').innerHTML = `<p class="mut"><span class="spin"></span> ${t('loading')}</p>`; R.shot() }
window.onShot = b64 => { $('#shotBox').innerHTML = b64 ? `<img class="shot" src="data:image/png;base64,${b64}">` : `<p class="mut">${t('needAdb')}</p>` };

/* ---------- pairing ---------- */
let prHidden = false, lastStatus = '';
function renderPair(){
  const st = S.status, show = S.mode === 'atv' && ['needpair','pairing','code','paired'].includes(st) && !prHidden;
  $('#pr').hidden = !show;
  if (!show) { if (SHEETS.every(s => $(s).hidden)) $('#scrim').hidden = true; return }
  $('#scrim').hidden = false;
  if (st === 'code') {
    if ($('#codeIn')) return;
    $('#pr').innerHTML = `<h3>${t('prCode')}</h3><input class="inp code" id="codeIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="mut" id="codeErr" style="margin-top:8px;min-height:20px"></div><div class="flex" style="margin-top:6px"><button class="btn alt" id="prX" style="flex:1">✕</button><button class="btn" id="codeOk" style="flex:2">🔗</button></div>`;
    const i = $('#codeIn'); setTimeout(() => i.focus(), 80);
    const send = () => { const v = i.value.trim().toUpperCase(); if (v.length !== 6) return;
      if (!R.code(v)) { $('#codeErr').textContent = t('prBad'); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.select() }
      else $('#codeErr').innerHTML = `<span class="spin" style="width:14px;height:14px;border-width:2px"></span> ${t('prWait')}` };
    i.addEventListener('input', () => { i.value = i.value.toUpperCase().replace(/[^0-9A-F]/g, ''); if (i.value.length === 6) send() });
    $('#codeOk').onclick = send; $('#prX').onclick = () => { prHidden = true; R.cancelPair(); renderPair() };
    return;
  }
  const msg = st === 'pairing' ? `<span class="spin" style="width:16px;height:16px;border-width:2px"></span> ${t('prWait')}`
    : (S.error === 'badcode' ? t('prBad') : (S.error && lastStatus === 'code') ? t('prFail') : '');
  $('#pr').innerHTML = `<h3>${st === 'paired' ? t('prOk') : t('prNeed')}</h3>
    <div class="mut ltr" style="text-align:start">${esc(S.name)} · ${esc(S.host)}</div>
    ${st === 'needpair' ? `<p style="margin:12px 0;line-height:1.6">${t('prNeedS')}</p>` : ''}
    ${msg && st !== 'paired' ? `<p style="margin:8px 0">${msg}</p>` : ''}
    ${st === 'needpair' ? `<div class="flex" style="margin-top:12px"><button class="btn alt" id="prX" style="flex:1">✕</button><button class="btn" id="prGo" style="flex:2">${t('prStart')}</button></div>
      <button class="btn alt wide sm" id="prAdb" style="margin-top:10px">${t('prAdb')}</button>` : ''}`;
  if ($('#prGo')) $('#prGo').onclick = () => R.pair();
  if ($('#prX')) $('#prX').onclick = () => { prHidden = true; renderPair() };
  if ($('#prAdb')) $('#prAdb').onclick = () => { prHidden = true; R.setPref('method', 'adb') };
}

/* ---------- doctor ---------- */
function doctorHtml(){
  const d = S.doctor;
  if (!d) return `<p class="mut"><span class="spin"></span> ${t('probing')}</p>`;
  const yn = (ok, label) => `<div><span class="${ok ? 'y' : 'n'}">${ok ? '✔' : '✖'}</span>${label}</div>`;
  const old = (S.found || []).some(f => f.host === d.host && f.old);
  let advice;
  if (!d.sameNet) advice = `<p>${t('aNet')}</p>`;
  else if (!d.ping) advice = `<p>${t('aPing')}</p>`;
  else if (d.adb && !d.atv) advice = `<p>${t('aAdbOk')}</p><button class="btn wide" onclick="R.setPref('method','adb')">${t('useAdb')}</button>`;
  else if (!d.atv && !d.adb && (d.atvState === 'timeout' || d.adbState === 'timeout') && d.atvState !== 'refused') advice = `<p>${t('aSleep')}</p><ol class="steps"><li>${t('z1')}</li><li>${t('z2')}</li><li>${t('z3')}</li><li>${t('z4')}</li></ol><ol class="steps" start="5"><li>${t('s2')}</li><li>${t('s3')}</li></ol>`;
  else if (!d.atv && !d.adb) advice = `<p>${old ? t('aOld') + '<br>' : ''}${t('aShut')}</p><ol class="steps"><li>${t('s1')}</li><li>${t('s2')}</li><li>${t('s3')}</li><li>${t('s4')}</li></ol>`;
  else advice = d.adb ? `<button class="btn alt wide" onclick="R.setPref('method','adb')">${t('useAdb')}</button>` : '';
  return `<div class="doc ltr">${yn(true, t('dPhone') + ' ' + esc(d.phone || '?'))}${yn(d.sameNet, t('dSame'))}${yn(d.ping, t('dPing'))}${yn(d.atv, t('dAtv') + ' 6466')}${yn(d.pair, t('dPair') + ' 6467')}${yn(d.adb, t('dAdb') + ' 5555')}</div>
    <div style="font-size:13.5px;line-height:1.6">${advice}</div>
    <button class="btn alt wide" style="margin-top:10px" onclick="R.reconnect()">🔄 ${t('retry')}</button>`;
}

/* ---------- header / hero ---------- */
const BUSY = ['connecting','probing','pairing','auth'];
function renderTop(){
  const st = S.status;
  $('#chip').className = 'chip ' + (st === 'connected' ? 'ok' : BUSY.includes(st) || st === 'code' ? 'wait' : S.host ? 'bad' : '');
  $('#tvName').textContent = S.name || 'ROWA TV';
  const sub = [t(st)]; if (st === 'connected' && S.on === false) sub.push('💤 ' + t('off')); if (S.app && st === 'connected') sub.push(S.app.split('.').pop());
  $('#tvSub').textContent = sub.join(' · ');
  const tag = $('#tvTag'); tag.hidden = !S.mode; tag.textContent = S.mode === 'adb' ? 'ADB' : 'GOOGLE'; tag.className = 'tag ' + (S.mode === 'adb' ? 'a' : 'g');
  const v = S.vol >= 0 && st === 'connected'; $('#vol').hidden = !v;
  if (v) { $('#volI').style.width = (S.muted ? 0 : Math.round(100 * S.vol / (S.volMax || 100))) + '%'; $('#volN').textContent = S.muted ? '🔇' : S.vol }
  // banner
  const ban = $('#ban'); let b = null;
  const errTxt = e => !e || e === 'reconnecting' ? '' : /timeout|timed out|failed to connect|unreachable|EHOSTUNREACH/i.test(e) ? t('errTimeout') : /refused|ECONNREFUSED/i.test(e) ? t('errRefused') : '';
  if (S.wifi === false) b = ['bad', '📶', t('noWifi'), null];
  else if (st === 'auth') b = ['warn', '📺', t('authT'), null];
  else if (S.host && (st === 'offline' || st === 'idle' || st === 'unreachable')) { const x = errTxt(S.error); b = ['bad', '📡', t(st === 'unreachable' ? 'unreachable' : 'offline') + (x ? ' — ' + x : ''), [t('retry'), () => R.reconnect()]] }
  else if (st === 'needpair' && prHidden && S.mode === 'atv') b = ['', '🔗', t('needpair'), [t('pairNow'), () => { prHidden = false; renderPair() }]];
  ban.hidden = !b;
  if (b) { ban.className = 'ban ' + b[0]; $('#banE').textContent = b[1]; $('#banT').textContent = b[2]; $('#banB').hidden = !b[3]; if (b[3]) { $('#banB').textContent = b[3][0]; $('#banB').onclick = b[3][1] } }
  // hero card on the remote page
  const hero = $('#hero');
  if (!S.host) hero.innerHTML = `<div class="card"><h3>${t('findTitle')}</h3><div class="mut">${t('findHint')}</div>${foundList()}
      ${S.scanning ? `<div class="bar"><i style="width:${Math.max(5, S.scanPct)}%"></i></div>` : `<button class="btn wide" style="margin-top:12px" onclick="R.scan()">${t('scan')}</button>`}
      <div class="flex" style="margin-top:10px"><input class="inp ltr" id="ip2" inputmode="decimal" placeholder="192.168.1.50"><button class="btn" onclick="manualIp('#ip2')">➕</button></div></div>`;
  else if (st === 'noports' || st === 'probing') hero.innerHTML = `<div class="card"><h3>${t('docT')}</h3>${st === 'probing' ? `<p class="mut"><span class="spin"></span> ${t('probing')}</p>` : doctorHtml()}</div>`;
  else hero.innerHTML = '';
}
function badges(d){ return `<div class="badges">${d.atv ? '<span class="tag g">GOOGLE</span>' : ''}${d.adb ? '<span class="tag a">ADB</span>' : ''}${d.cast ? '<span class="tag">CAST</span>' : ''}${d.old ? '<span class="tag">OLD</span>' : ''}</div>` }
function foundList(){
  const f = (S.found || []).filter(d => d.atv || d.adb || d.cast || d.old);
  if (!f.length) return `<div class="mut" style="margin-top:10px">${S.scanning ? '<span class="spin" style="width:14px;height:14px;border-width:2px"></span> ' + t('scanning') : t('nothing')}</div>`;
  return '<div style="margin-top:6px">' + f.map(d => `<div class="li"><div class="t"><b>📺 ${esc(d.name)}</b><small class="ltr">${esc(d.host)}</small>${badges(d)}</div><button class="btn sm" onclick="R.use(${J(d.host)},${J(d.name)})">${t('use')}</button></div>`).join('') + '</div>';
}
function manualIp(sel){ const h = $(sel).value.trim(); if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(h)) { $(sel).classList.remove('shake'); void $(sel).offsetWidth; $(sel).classList.add('shake'); return } R.use(h, 'TV ' + h); $(sel).value = '' }

/* ---------- settings ---------- */
function renderSet(){
  const saved = S.tvs || [], hosts = new Set(saved.map(x => x.host)), fmap = {}; (S.found || []).forEach(f => fmap[f.host] = f);
  $('#tvList').innerHTML = saved.map(d => `<div class="li"><div class="t"><b>${d.host === S.host ? '✅ ' : '📺 '}${esc(d.name)}</b><small class="ltr">${esc(d.host)}${d.host === S.host ? ' · ' + t(S.status) : ''}</small>${fmap[d.host] ? badges(fmap[d.host]) : ''}</div>
      ${d.host === S.host ? '' : `<button class="btn sm" onclick="R.use(${J(d.host)},${J(d.name)})">${t('use')}</button>`}
      <button class="btn sm alt" onclick="R.forget(${J(d.host)})">🗑️</button></div>`).join('')
    + (S.found || []).filter(d => !hosts.has(d.host) && (d.atv || d.adb || d.cast)).map(d => `<div class="li"><div class="t"><b>🆕 ${esc(d.name)}</b><small class="ltr">${esc(d.host)}</small>${badges(d)}</div><button class="btn sm" onclick="R.use(${J(d.host)},${J(d.name)})">${t('use')}</button></div>`).join('')
    || `<div class="mut">${t('nothing')}</div>`;
  $('#scanBtn').textContent = S.scanning ? t('scanning') : t('scan'); $('#scanBtn').disabled = !!S.scanning;
  $('#scanBar').hidden = !S.scanning; $('#scanBarI').style.width = Math.max(5, S.scanPct) + '%';
  $('#docBtn').disabled = !S.host;
  $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === (S.method || 'auto')));
  $('#pairBtn').disabled = !S.host;
  $('#prefs').innerHTML = ['haptic','volKeys','keepOn','autoKb','autoUpdate'].map(k =>
    `<div class="li"><div class="t"><b style="font-weight:600;white-space:normal">${t(k)}</b></div><label class="sw"><input type="checkbox" data-pref="${k}" ${S[k] ? 'checked' : ''}><i></i></label></div>`).join('');
  $$('[data-pref]').forEach(c => c.onchange = () => { S[c.dataset.pref] = c.checked; R.setPref(c.dataset.pref, String(c.checked)) });
  $('#verT').textContent = `${t('ver')} ${S.version}`;
  const busy = S.upStatus === 'downloading' || S.upStatus === 'installing';
  $('#verS').textContent = S.update ? `🆕 ${t('latest')}: 1.0.${S.latest}` : (S.upError ? '⚠️ ' + S.upError : S.latest ? t('uptodate') : '');
  $('#upBtn').textContent = busy ? (S.upPct >= 0 ? S.upPct + '%' : '…') : S.update ? t('updateNow') : (S.upStatus === 'checking' ? '…' : t('check'));
  $('#upBtn').disabled = busy; $('#upBtn').onclick = () => S.update ? R.installUpdate() : R.checkUpdate();
  $('#upBar').hidden = !busy; $('#upBarI').style.width = Math.max(0, S.upPct) + '%';
  $('#credV').textContent = S.version;
}
$('#scanBtn').onclick = () => R.scan();
$('#docBtn').onclick = () => { R.doctor(); go('remote') };
$$('#seg button').forEach(b => b.onclick = () => { S.method = b.dataset.m; R.setPref('method', b.dataset.m); renderSet() });
$('#pairBtn').onclick = () => { prHidden = false; R.pair() };
$('#ipBtn').onclick = () => manualIp('#ip');
$('#langBtn').onclick = () => { L = L === 'ar' ? 'en' : 'ar'; R.setPref('lang', L); applyLang(); render(); renderApps() };
$('#keyBtn').onclick = () => { if (confirm(t('newkeyhint') + '?')) { prHidden = false; R.resetKey() } };

/* ---------- update pop-up (once per open) ---------- */
let popShown = false;
function renderPop(){
  if (popShown || !S.update) return; popShown = true;
  $('#upPopT').textContent = `${t('newVer')} 1.0.${S.latest}`; $('#upPopS').textContent = `${t('current')}: ${S.version}`;
  $('#upLater').textContent = t('later'); $('#upNow').textContent = t('updateNow'); $('#upPop').hidden = false;
}
$('#upLater').onclick = () => $('#upPop').hidden = true;
$('#upNow').onclick = () => { $('#upPop').hidden = true; R.installUpdate(); go('set') };

/* ---------- state ---------- */
function render(){
  if (S.status !== lastStatus) {
    if (S.status === 'needpair' && lastStatus !== 'code' && lastStatus !== 'pairing') prHidden = false;
    if (S.status !== 'code' && $('#codeIn')) $('#pr').innerHTML = '';
  }
  renderTop(); renderPair(); if (page === 'set') renderSet(); renderPop();
  const a = JSON.stringify(S.apps); if (a !== render._apps) { render._apps = a; renderApps() }
  lastStatus = S.status;
}
window.onRowa = s => { S = s; render() };
window.rowaBack = () => {
  if (!$('#upPop').hidden) { $('#upPop').hidden = true; return true }
  if (SHEETS.some(s => !$(s).hidden)) { closeSheets(); return true }
  if (!$('#pr').hidden) { prHidden = true; if (S.status === 'code') R.cancelPair(); renderPair(); return true }
  if (page !== 'remote') { go('remote'); return true }
  return false;
};
applyLang(); bindKeys(); render();
