<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ذكاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e5; --paper:#ffffff; --ink:#2a2150; --mute:#8a84a6; --line:#eadfc8;
  --c:#7c5cff; --cd:#5a3fd6;            /* current game colour + its darker edge */
  --good:#22b573; --bad:#ef4b5a; --on:#ffb703; --off:#c9cfdb; --gold:#ffb703;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{font-family:'Baloo Bhaijaan 2','Noto Sans Arabic',Tahoma,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 8%,#ffe3a8 0 90px,transparent 91px),radial-gradient(circle at 92% 22%,#d9ceff 0 70px,transparent 71px),radial-gradient(circle at 80% 96%,#bdf0d8 0 110px,transparent 111px);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;font-size:18px;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;width:100%;outline:none;user-select:text}
input:focus{border-color:var(--c)}
.view{display:none;max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100%}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}

/* chunky toy buttons */
.toy{background:var(--paper);border-radius:22px;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.toy:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.btn{display:block;width:100%;padding:14px 18px;border-radius:20px;font-weight:800;font-size:19px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:16px;border-radius:14px;box-shadow:0 4px 0 var(--cd)}
.btn.ghost.sm{box-shadow:0 4px 0 var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* who */
.logo{text-align:center;margin:18px 0 4px;font-weight:800;font-size:54px;line-height:1.1;color:var(--c)}
.logo small{display:block;font-size:17px;color:var(--mute);font-weight:700}
.kid{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:16px;width:100%;text-align:right}
.kid .av{font-size:50px;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;flex:none}
.kid b{font-size:22px;font-weight:800;display:block;line-height:1.3}
.kid span{color:var(--mute);font-weight:700;font-size:15px}
.kid .ed{margin-inline-start:auto;width:44px;height:44px;border-radius:14px;background:var(--bg);font-size:20px;flex:none}
.gear{position:absolute;top:14px;left:16px;width:48px;height:48px;border-radius:16px;font-size:24px}

/* home */
.hud{display:flex;align-items:center;gap:10px}
.hud .me{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;font-weight:800;font-size:18px}
.hud .me i{font-style:normal;font-size:30px}
.pill{margin-inline-start:auto;background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--line);direction:ltr}
.pill+.pill{margin-inline-start:0}
h2{font-size:24px;font-weight:800;margin:20px 4px 12px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{padding:14px 12px 12px;text-align:center;position:relative;overflow:hidden}
.game .gi{font-size:44px;width:74px;height:74px;border-radius:24px;margin:0 auto 6px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff)}
.game b{display:block;font-weight:800;font-size:18px;line-height:1.3}
.game span{font-size:13px;font-weight:700;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:var(--bg);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c)}

/* levels */
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{width:48px;height:48px;border-radius:16px;font-size:22px;flex:none}
.head b{font-size:22px;font-weight:800;flex:1}
.how{background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:18px;padding:10px 14px;font-weight:700;font-size:16px;margin:10px 0}
.tier{display:flex;align-items:center;gap:8px;margin:18px 4px 10px;font-weight:800;font-size:18px}
.tier i{font-style:normal;flex:1;height:4px;border-radius:2px;background:var(--line)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lv button{aspect-ratio:1;border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv button small{font-size:12px;letter-spacing:-1px}
.lv button.done{background:var(--c);color:#fff;box-shadow:0 5px 0 var(--cd)}
.lv button.open{border:3px dashed var(--c);animation:bob 1.4s infinite}
.lv button.lock{color:var(--off);background:#f6efe0;box-shadow:none}
@keyframes bob{50%{transform:translateY(-4px)}}

/* play */
.dots{display:flex;gap:6px;direction:ltr}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.hint{padding:8px 14px;border-radius:16px;font-weight:800;font-size:18px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #d99500;direction:ltr;flex:none}
.hint:active{transform:translateY(3px);box-shadow:0 2px 0 #d99500}
#stage{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ask{font-weight:800;font-size:21px;text-align:center}
.note{font-weight:700;color:var(--mute);font-size:15px;text-align:center;margin-top:-8px}
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;direction:ltr}
.bub{min-width:46px;height:58px;padding:0 8px;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-weight:800;font-size:24px}
.bub.q{background:color-mix(in srgb,var(--c) 15%,#fff);border:3px dashed var(--c);box-shadow:none}
.bub.good{background:var(--good);color:#fff;border:0;box-shadow:0 5px 0 #17875a}
.bub.dead{opacity:.45}
.eq{direction:ltr;font-weight:800;font-size:34px;background:#fff;border-radius:24px;padding:18px 16px;box-shadow:0 6px 0 var(--line);text-align:center;width:100%;line-height:1.5}
.eq.good{background:var(--good);color:#fff;box-shadow:0 6px 0 #17875a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;direction:ltr}
.opt{padding:16px 8px;border-radius:20px;background:#fff;box-shadow:0 6px 0 var(--line);font-weight:800;font-size:28px;word-spacing:14px}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.good{background:var(--good);color:#fff;box-shadow:0 6px 0 #17875a}
.opt.bad{background:#ffe1e4;color:var(--bad);box-shadow:none;opacity:.6}
.opt.gone{opacity:.25;box-shadow:none}
.explain{background:#fff3c9;border-radius:18px;padding:10px 14px;font-weight:700;font-size:17px;width:100%;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pulse{animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.14);box-shadow:0 0 0 6px var(--gold)}}

.board{display:grid;gap:5px;width:min(100%,58vh);direction:ltr;background:var(--ink);padding:8px;border-radius:22px}
.tile{aspect-ratio:1;background:#3b3170;border-radius:10px;display:grid;place-items:center;position:relative}
.tile svg{width:100%;height:100%;display:block}
.tile.lk::after{content:'📌';position:absolute;top:0;right:1px;font-size:11px}
.tile:active{transform:scale(.93)}
.lamp{aspect-ratio:1;border-radius:50%;background:#3b3170;font-size:clamp(20px,7vw,40px);display:grid;place-items:center;filter:grayscale(1) brightness(.6);transition:.15s}
.lamp.on{background:var(--on);filter:none;box-shadow:0 0 18px #ffd66b}

.sud{display:grid;width:min(100%,56vh);direction:ltr;background:var(--ink);border:4px solid var(--ink);border-radius:16px;overflow:hidden;gap:1px}
.sud button{aspect-ratio:1;background:#fff;font-weight:800;font-size:clamp(15px,5.4vw,30px);color:var(--c);display:grid;place-items:center}
.sud button.gv{color:var(--ink);background:#fbf3df}
.sud button.b2{background:#f1ecff}.sud button.b2.gv{background:#e6dcc2}
.sud button.sel{background:var(--gold)!important}
.sud button.bx{margin-right:3px}.sud button.by{margin-bottom:3px}
.sud button.no{background:#ffc2c8!important}
.pad{display:grid;justify-content:center;gap:8px;direction:ltr;width:100%}
.pad button{width:100%;height:54px;border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:24px}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}

.pic{font-size:92px;line-height:1.1}
.slots,.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:rtl}
.slot{width:50px;height:58px;border-radius:14px;border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);font-weight:800;font-size:28px;display:grid;place-items:center}
.slot.lk{border-style:solid;background:#fff3c9}
.slot.good{background:var(--good);color:#fff;border:0}
.let{width:56px;height:62px;border-radius:16px;background:#fff;box-shadow:0 6px 0 var(--line);font-weight:800;font-size:30px}
.let.used{opacity:.15;box-shadow:none}
.word{font-weight:800;font-size:40px;color:var(--good)}

.mem{display:grid;gap:10px;width:min(100%,54vh);direction:ltr}
.mem button{aspect-ratio:1;border-radius:22px;opacity:.38;transition:opacity .1s,transform .1s;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.mem button.lit{opacity:1;transform:scale(1.06)}

/* popups */
.pop-bg{position:fixed;inset:0;background:rgba(42,33,80,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.pop-bg.show{display:flex}
.pop{background:var(--bg);border-radius:30px;padding:22px 20px;max-width:380px;width:100%;text-align:center;max-height:92vh;overflow:auto;animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.pop h3{font-size:26px;font-weight:800;margin:4px 0 6px}
.pop p{font-weight:700;margin:6px 0 12px}
.big{font-size:64px;line-height:1.1}
.stars{font-size:54px;direction:ltr;letter-spacing:4px}
.stars span{display:inline-block;filter:grayscale(1) opacity(.25)}
.stars span.on{filter:none;animation:star .5s both}
.stars span:nth-child(2){animation-delay:.2s}.stars span:nth-child(3){animation-delay:.4s}
@keyframes star{from{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.35)}}
.gift{display:inline-block;background:var(--gold);border-radius:16px;padding:6px 16px;font-weight:800;font-size:20px;margin:6px 0 10px}
.tip{background:#fff;border-radius:18px;padding:12px 14px;font-weight:700;font-size:16px;text-align:right;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.field{margin-bottom:12px;text-align:right}.field label{display:block;font-weight:800;font-size:15px;color:var(--mute);margin:0 6px 4px}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.avs button{width:46px;height:46px;border-radius:14px;font-size:26px;background:#fff}
.avs button.on{background:var(--gold)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px solid var(--line);font-weight:700;text-align:right}
.switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--off);border-radius:20px;transition:.2s}
.switch span:before{content:'';position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--good)}.switch input:checked+span:before{transform:translateX(-22px)}
.credit{color:var(--mute);font-size:12px;margin-top:14px;font-weight:700}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .2s}
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:18px;font-weight:800;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.confetti{position:fixed;top:-40px;font-size:26px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="view on" id="v-who">
  <button class="toy gear" onclick="App.settings()">⚙️</button>
  <div class="logo">🧠 ذكاء<small>ألغاز وحاجات ذكية تتصلّح!</small></div>
  <h2 style="text-align:center">مين هيلعب؟</h2>
  <div id="kids"></div>
</section>

<section class="view" id="v-home">
  <div class="hud">
    <button class="toy me" onclick="App.go('who')"><i id="hAv"></i><span id="hName"></span></button>
    <span class="pill" id="hStars"></span><span class="pill" id="hHints"></span>
  </div>
  <h2>اختار لعبة 🎮</h2>
  <div class="games" id="games"></div>
</section>

<section class="view" id="v-levels">
  <div class="head"><button class="toy back" onclick="App.go('home')">➜</button><b id="lTitle"></b><span class="pill" id="lHints"></span></div>
  <div class="how" id="lHow"></div>
  <div id="lBody"></div>
</section>

<section class="view" id="v-play">
  <div class="head"><button class="toy back" onclick="App.quit()">➜</button><b id="pTitle"></b><span class="dots" id="pDots"></span><button class="hint" id="pHint" onclick="App.hint()"></button></div>
  <div id="stage"></div>
</section>

<div class="pop-bg" id="popBg"><div class="pop" id="pop"></div></div>
<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
