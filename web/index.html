<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- bump when this page needs new native bridge methods; old apps then keep their bundled copy -->
<meta name="arkhas-bridge" content="1">
<title>أرخص · Arkhas</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1a16;--muted:#6f685d;--line:#e4ddcf;--accent:#0e7a5f;--accent-ink:#fff;--warn:#b25b00;--gold:#c9961a;--silver:#8d949c;--bronze:#a8673a}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--card:#1e1c17;--ink:#f1ece2;--muted:#a59d8f;--line:#33302a;--accent:#2fb38c;--accent-ink:#0b1410;--warn:#f0a24a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:26px;font-weight:800}
.logo small{font-size:13px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0001}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px}
.nav button b{font-size:21px;line-height:1.2;font-weight:400}
.nav button:active{background:var(--line)}
.nav button.on{color:var(--accent);font-weight:600}
form{display:flex;gap:8px;margin:16px 0 6px}
.qbox{flex:1;min-width:0;position:relative;display:flex}
.qbox input{padding-inline-end:40px}
.qbox input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:14px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.go{font:inherit;font-weight:700;font-size:16px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted);font-size:13px}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px;background:var(--card);font-size:13px}
.podium{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.pc{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;color:inherit;text-decoration:none}
.pc.r1{border-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.medal{font-size:26px;flex:none;width:30px;text-align:center}
.pc img,.row img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.pc .t{flex:1;min-width:0}
.ttl{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px}
.src{font-size:12.5px;color:var(--muted)}
.p{font-weight:800;font-size:19px;white-space:nowrap;color:var(--accent)}
.old{font-size:12px;color:var(--muted);text-decoration:line-through}
.save{font-size:12px;color:var(--accent);font-weight:600}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:inherit;text-decoration:none;margin-bottom:6px}
.row img{width:46px;height:46px}.row .t{flex:1;min-width:0}.row .p{font-size:15px;color:var(--ink)}
.nav button.flash b{filter:drop-shadow(0 0 4px #ffb300aa)}
.nav button.flash.on{color:#d97706}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.dt{margin:0;font-size:22px;font-weight:800}
.bolt{display:inline-block;animation:zap 1.6s ease-in-out infinite}
@keyframes zap{0%,100%{transform:scale(1)}50%{transform:scale(1.18) rotate(-8deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#d_range button.on{background:#e0412f;border-color:#e0412f;color:#fff}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;color:inherit;text-decoration:none}
.dc img{width:100%;height:120px;object-fit:contain;border-radius:10px;background:#fff}
.dc .off{position:absolute;top:8px;inset-inline-start:8px;background:#e0412f;color:#fff;font-weight:800;font-size:13px;padding:2px 8px;border-radius:8px}
.dc .ttl{font-size:13px;margin-top:6px;flex:1}
.dc .p{font-size:16px;margin-top:4px}
.dc .src{margin-top:2px}
.newver{display:block;width:100%;margin:10px 0 4px;padding:11px 14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px;text-align:start}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;font:inherit;font-size:15px;padding:10px;border:0;background:none;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.st .sx{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.upd{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 8px}
.upd.new{border-color:var(--accent)}
.upd-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.upd-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.upd-b .go{padding:10px 16px}
.ib2{font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ib2:disabled,.go:disabled{opacity:.5}
.nav b{position:relative}.dot{position:absolute;top:0;inset-inline-end:-4px;width:9px;height:9px;border-radius:50%;background:#e0412f;border:2px solid var(--card)}
.mb{font-size:11px;font-weight:700;border-radius:6px;padding:0 5px}.mb.ex{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.mb.si{color:var(--muted);border:1px solid var(--line)}
.flag{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 5px;margin-inline-start:4px}
h3{margin:22px 0 8px;font-size:15px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
details{margin-top:14px}summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:12.5px}td{padding:4px;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;margin:36px 0}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}.sheet>div{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.sheet input{font-size:15px;padding:10px 12px;width:100%}
.st{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.st input{width:auto;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🏷️ أرخص <small id="tag"></small></div>
  </header>

  <section id="searchView">
  <form id="f">
    <div class="qbox">
      <input id="q" type="search" dir="auto" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">

    </div>

  </form>
  <div class="muted" id="hint"></div>

  <div id="out"></div>
  </section>

  <section id="dealsView" hidden>
    <div class="dh">

    <div class="muted" id="d_sub"></div>

</div>

<nav class="nav">
  <button id="nav_search" class="on"><b>🔍</b><span id="l_search"></span></button>
  <button id="nav_deals" class="flash"><b>⚡</b><span id="l_deals"></span></button>

</nav>

<div class="sheet" id="sheet"><div>
  <h3 id="s_title" style="margin-top:0"></h3>
  <div class="upd" id="upd" hidden>
    <div class="upd-h"><b id="u_title"></b><span class="muted" id="u_cur"></span></div>
    <div id="u_msg" class="muted"></div>
    <div class="bar" id="u_bar" hidden><i></i></div>
    <div class="upd-b">
      <button class="go" id="u_install" hidden></button>
      <button class="ib2" id="u_check"></button>
      <button class="ib2" id="u_web"></button>
    </div>
  </div>
  <label id="s_lang"></label>
  <div class="seg" id="langseg"><button id="lang_ar" data-l="ar">عربي</button><button id="lang_en" data-l="en">English</button></div>
  <label for="serp">SerpAPI key</label>
  <input id="serp" placeholder="optional" autocomplete="off">
  <div class="muted" id="s_serp"></div>
  <label for="city" id="s_city"></label>
  <input id="city" placeholder="cairo">
  <label id="s_stores"></label>
  <div id="storelist"></div>
  <div class="muted" id="s_ver" style="margin-top:12px"></div>
  <button class="go" id="s_save" style="width:100%;padding:12px;margin-top:14px"></button>
</div></div>

<script src="engine.js"></script>
<script>
"use strict";
// ---------- native bridge (Android). Falls back to window.fetch when opened in a desktop browser. ----------
const N = window.Native || null;
const pending = new Map(); let seq = 0;
window.__native = (id, ok, text) => { const p = pending.get(id); if (!p) return; pending.delete(id); ok ? p.res(text) : p.rej(new Error(text)); };
function fetcher(url, o = {}) {
  if (!N) return fetch(url).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
  return new Promise((res, rej) => { const id = ++seq; pending.set(id, { res, rej }); N.fetch(id, url, JSON.stringify(o)); });
}
function call(fn, ...args) {   // async native methods that answer through window.__native
  return new Promise((res, rej) => { const id = ++seq; pending.set(id, { res, rej }); N[fn](id, ...args); });
}
const pref = (k, d = "") => { try { return (N ? N.getPref(k) : localStorage.getItem(k)) || d; } catch (_) { return d; } };
const setPref = (k, v) => { try { N ? N.setPref(k, v) : localStorage.setItem(k, v); } catch (_) {} };
const readConfig = async (name) => (N ? N.readConfig(name) : (await fetch(name)).text());

// ---------- text ----------
const T = {
  ar: { tag: "أرخص سعر في مصر", go: "ابحث", ph: "اكتب المنتج… مثال: ايفون 15 برو", hint: "نبحث في المتاجر المصرية بالعربي والإنجليزي ونجيب لك أرخص 3",
    top: "🏆 أرخص 3 أسعار", all: "كل العروض ({n})", fb: "📘 فيسبوك والمستعمل", searched: "بحثنا عن:", none: "مفيش نتائج مطابقة لسه…",
    noneDone: "مفيش نتائج مطابقة. جرّب اسم أدق.", src: "حالة المتاجر", langLbl: "🌐 اللغة", storesHint: "آخر بحث: عدد النتائج من كل متجر", navSearch: "بحث", navStatus: "المتاجر", navGear: "الإعدادات", acc: "إكسسوار؟", cheap: "سعر مريب", rAll: "كل الخصومات", r30: "30%+", r5070: "🔥 50–70%", r70: "70%+", rNone: "مفيش عروض في النطاق ده — جرّب نطاق تاني", navDeals: "عروض", dealsTitle: "عروض فلاش", dealsSub: "أكبر الخصومات من أشهر {n} مواقع في مصر — اتحدّثت {t}", dealsLoading: "جاري جلب العروض من {done}/{all} موقع…", dealsNone: "مفيش عروض دلوقتي — اضغط ↻", sortPct: "أكبر خصم", sortPrice: "الأرخص", sortSave: "أكبر توفير", allStores: "الكل", justNow: "الآن", minAgo: "من {m} دقيقة", banner: "🎉 نسخة جديدة {v} — اضغط للتحديث", openRel: "⬇️ تنزيل {v} من GitHub", relNote: "هتتفتح صفحة التنزيل — نزّل الملف وافتحه للتثبيت. بعد كده التحديث هيكون من جوه التطبيق", upd: "🔄 التحديثات", cur: "نسختك {v}", check: "تحقق من التحديث", checking: "جاري التحقق…", latest: "عندك أحدث نسخة ✓",
    newVer: "نسخة جديدة {v} متاحة ({mb} ميجا)", install: "⬇️ تنزيل وتثبيت {v}", downloading: "جاري التنزيل… {p}%", installing: "افتح شاشة التثبيت واضغط تثبيت",
    perm: "اسمح لـ أرخص بتثبيت التحديثات (فتحنا لك الإعداد) ثم ارجع واضغط تثبيت تاني", webBtn: "تحديث قائمة المتاجر", webSame: "قائمة المتاجر محدّثة ✓",
    webChanged: "تم تحديث المتاجر — جاري إعادة التحميل…", updErr: "تعذّر: {e}", exact: "✓ مطابق", similar: "≈ مشابه", other: "موديل مختلف", fewExact: "لقينا {n} بس مطابقين تمامًا — الباقي مشابه", egp: "ج.م", save: "وفّر {n}",
    searching: "جاري البحث في {done}/{all} متجر…", settings: "الإعدادات", serpNote: "اختياري: يضيف جوجل شوبينج (مئات المتاجر). مفتاح مجاني من serpapi.com",
    city: "مدينة فيسبوك ماركت بليس", stores: "المتاجر", saveBtn: "حفظ", ver: "نسخة", hidden: "تم إخفاء {n} نتيجة غير مطابقة" },
  en: { tag: "Best price in Egypt", go: "Search", ph: "Product… e.g. iphone 15 pro", hint: "Searching Egyptian stores in Arabic & English — top 3 cheapest",
    top: "🏆 Top 3 prices", all: "All offers ({n})", fb: "📘 Facebook & used", searched: "Searched:", none: "No matches yet…",
    noneDone: "No matching results. Try a more specific name.", src: "Store status", langLbl: "🌐 Language", storesHint: "Last search: results per store", navSearch: "Search", navStatus: "Stores", navGear: "Settings", acc: "accessory?", cheap: "suspicious price", rAll: "All discounts", r30: "30%+", r5070: "🔥 50–70%", r70: "70%+", rNone: "No deals in this range — try another one", navDeals: "Deals", dealsTitle: "Flash deals", dealsSub: "Biggest discounts from {n} top Egyptian sites — updated {t}", dealsLoading: "Fetching deals from {done}/{all} sites…", dealsNone: "No deals right now — tap ↻", sortPct: "Biggest % off", sortPrice: "Cheapest", sortSave: "Most saved", allStores: "All", justNow: "just now", minAgo: "{m} min ago", banner: "🎉 New version {v} — tap to update", openRel: "⬇️ Download {v} from GitHub", relNote: "The download page opens — download the file and open it to install. After this, updates happen inside the app", upd: "🔄 Updates", cur: "You have {v}", check: "Check for update", checking: "Checking…", latest: "You have the latest version ✓",
    newVer: "New version {v} available ({mb} MB)", install: "⬇️ Download & install {v}", downloading: "Downloading… {p}%", installing: "Tap Install on the Android screen",
    perm: "Allow Arkhas to install updates (settings opened), then come back and tap install again", webBtn: "Refresh store list", webSame: "Store list is up to date ✓",
    webChanged: "Stores updated — reloading…", updErr: "Failed: {e}", exact: "✓ exact", similar: "≈ similar", other: "other model", fewExact: "Only {n} exact match(es) — the rest are similar", egp: "EGP", save: "save {n}",
    searching: "Searching {done}/{all} stores…", settings: "Settings", serpNote: "Optional: adds Google Shopping (hundreds of stores). Free key at serpapi.com",
    city: "Facebook Marketplace city", stores: "Stores", saveBtn: "Save", ver: "Version", hidden: "{n} irrelevant results hidden" },
};
let L = pref("lang", "ar");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => Math.round(v).toLocaleString(L === "ar" ? "ar-EG" : "en-US") + " " + T[L].egp;
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
let STORES = [], last = null, total = 0, busy = false;

function applyLang() {
  const t = T[L];
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("#tag").textContent = t.tag; $("#go").textContent = t.go; $("#q").placeholder = t.ph; $("#hint").textContent = t.hint;
  $("#s_lang").textContent = t.langLbl;
  for (const b of document.querySelectorAll("#langseg button")) b.classList.toggle("on", b.dataset.l === L);
  $("#l_deals").textContent = t.navDeals; $("#d_title").textContent = t.dealsTitle;
  if (typeof renderDeals === "function" && dealsData) renderDeals();
  $("#l_search").textContent = t.navSearch; $("#l_gear").textContent = t.navGear;
  $("#s_title").textContent = "⚙️ " + t.settings; $("#s_serp").textContent = t.serpNote; $("#s_city").textContent = t.city;
  $("#s_stores").textContent = t.stores; $("#s_save").textContent = t.saveBtn;
  $("#s_ver").textContent = t.ver + " " + (N && N.appVersion ? N.appVersion() : "web");
  if (typeof canUpdate !== "undefined" && (canUpdate || canLink)) showUpd();
  if (last) render(last, !busy);
}
$("#langseg").onclick = (e) => { const l = e.target.dataset && e.target.dataset.l; if (l && l !== L) { L = l; setPref("lang", L); applyLang(); if ($("#sheet").classList.contains("on")) $("#gear").click(); } };

// ---------- render ----------
const img = (o) => (o.image ? `<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : "");
const flags = (o) => o.flags.map((f) => `<span class="flag">${f === "possible-accessory" ? T[L].acc : f === "other-model" ? T[L].other : T[L].cheap}</span>`).join("");
const badge = (o) => `<span class="mb ${o.match === 0 ? "ex" : "si"}">${o.match === 0 ? T[L].exact : T[L].similar}</span>`;

function render(r, done) {
  const t = T[L]; let h = "";
  h += `<div class="muted">${t.searched} ${r.variants.map((v) => `<span class="chip">${esc(v)}</span>`).join("")}</div>`;
  if (r.top3.length) {
    h += `<h3>${t.top}</h3>`;
    const nExact = r.top3.filter((o) => o.match === 0).length;
    if (done && nExact < r.top3.length && nExact < 3) h += `<div class="muted">${fmt(t.fewExact, { n: nExact })}</div>`;
    h += `<div class="podium">`;
    r.top3.forEach((o, i) => {
      const off = o.old_price && o.old_price > o.price ? `<div class="old">${money(o.old_price)}</div><div class="save">${fmt(t.save, { n: money(o.old_price - o.price) })}</div>` : "";
      h += `<a class="pc r${i + 1}" href="${esc(o.url)}"><div class="medal">${["🥇", "🥈", "🥉"][i]}</div>${img(o)}
        <div class="t"><div class="ttl">${esc(o.title)}</div><div class="src">${badge(o)} ${esc(o.source)}${flags(o)}</div></div>
        <div style="text-align:end"><div class="p">${money(o.price)}</div>${off}</div></a>`;
    });
    h += `</div>`;
  } else h += `<div class="empty">${done ? t.noneDone : t.none}</div>`;

  const rest = r.offers.filter((o) => !r.top3.includes(o));
  if (rest.length) {
    h += `<details><summary>${fmt(t.all, { n: r.offers.length })}</summary>`;
    for (const o of rest) h += `<a class="row" href="${esc(o.url)}">${img(o)}<div class="t"><div class="ttl">${esc(o.title)}</div>
      <div class="src">${badge(o)} ${esc(o.source)}${flags(o)}</div></div><div class="p">${money(o.price)}</div></a>`;
    h += `</details>`;
  }
  if (done && r.hidden) h += `<div class="muted">${fmt(t.hidden, { n: r.hidden })}</div>`;

  h += `<h3>${t.fb}</h3><div class="links">${r.links.map((l) => `<a href="${esc(l.url)}">${esc(l.name)}</a>`).join("")}</div>`;
  const srcs = r.sources.slice().sort((a, b) => b.count - a.count || a.ms - b.ms);
  h += `<details id="status"${statusOpen ? " open" : ""}><summary>${t.src} · ${srcs.filter((x) => x.count).length}/${r.total || srcs.length}</summary><table>${srcs.map((s) =>
    `<tr><td>${s.count ? "✅" : s.ok ? "➖" : "⚠️"} ${esc(s.source)}</td><td>${s.count}</td><td>${(s.ms / 1000).toFixed(1)}s</td>` +
    `<td>${esc(s.error || (s.query && s.query !== r.query ? "→ " + s.query : ""))}</td></tr>`).join("")}</table></details>`;
  const st = document.getElementById("status");
  if (st) statusOpen = st.open;
  $("#out").innerHTML = h;
  const st2 = document.getElementById("status");
  if (st2) st2.ontoggle = () => { statusOpen = st2.open; };
}
let statusOpen = false;

// stores marked default_off (slow, JS-only sites) stay off until switched on in ⚙️
function isOn(s) {
  if (s.enabled === false) return false;
  return s.default_off ? JSON.parse(pref("enabled", "[]")).includes(s.name) : !JSON.parse(pref("disabled", "[]")).includes(s.name);
}

function progress(r) {
  $("#bar").hidden = false;
  $("#bar i").style.width = Math.max(8, (100 * r.sources.length) / total) + "%";
  $("#hint").textContent = fmt(T[L].searching, { done: r.sources.length, all: total });
}

// ---------- search ----------
async function run(q) {
  q = (q || "").trim(); if (q.length < 2 || busy) return;
  $("#q").value = q; syncX(); $("#q").blur(); busy = true; $("#out").innerHTML = "";
  const stores = STORES.filter(isOn);
  const serpKey = pref("serp");
  total = stores.length + (serpKey ? 1 : 0);
  progress({ sources: [] });
  try {
    last = await Arkhas.search(q, { stores, fetcher, serpKey, city: pref("city", "cairo"),
      onProgress: (r) => { last = r; render(r, false); progress(r); } });
    render(last, true);
  } catch (e) { $("#out").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`; }
  finally { busy = false; $("#bar").hidden = true; $("#hint").textContent = T[L].hint; }
}
window.arkhasSearch = (q) => { showView("search"); return run(q); };  // called by the app for Share / text-selection searches
$("#f").onsubmit = (e) => { e.preventDefault(); run($("#q").value); };

// ---------- settings ----------
$("#gear").onclick = () => {
  if (canUpdate || canLink) { showUpd(); checkUpd(false); }
  $("#serp").value = pref("serp"); $("#city").value = pref("city", "cairo");
  // store status from the last search sits next to each store
  const stat = Object.fromEntries(((last && last.sources) || []).map((x) => [x.source, x]));
  const sx = (n) => { const x = stat[n]; if (!x) return ""; return `<span class="sx" title="${esc(x.error || "")}">${x.count ? "✅ " + x.count : x.ok ? "➖ 0" : "⚠️ " + esc((x.error || "").slice(0, 18))} · ${(x.ms / 1000).toFixed(1)}s</span>`; };
  $("#s_stores").textContent = T[L].stores + (last ? " — " + T[L].storesHint : "");
  $("#storelist").innerHTML = STORES.filter((s) => s.enabled !== false).map((s) =>
    `<label class="st"><input type="checkbox" data-n="${esc(s.name)}" ${isOn(s) ? "checked" : ""}> ${esc(s.name)}${s.default_off ? ' <span class="muted">🐢</span>' : ""}${sx(s.name)}</label>`).join("");
  $("#sheet").classList.add("on");
};
$("#nav_search").onclick = () => { showView("search"); window.scrollTo({ top: 0, behavior: "smooth" }); focusEnd(); };

// search box: tap anywhere inside to place the cursor and edit; ✕ clears; nothing auto-selects the text
function focusEnd() {
  const q = $("#q"); q.focus();
  try { const n = q.value.length; q.setSelectionRange(n, n); } catch (_) {}
}
const syncX = () => { $("#qx").hidden = !$("#q").value; };
$("#q").addEventListener("input", syncX);
$("#qx").onclick = () => { $("#q").value = ""; syncX(); $("#q").focus(); };
$("#sheet").onclick = (e) => { if (e.target.id === "sheet") $("#sheet").classList.remove("on"); };
$("#s_save").onclick = () => {
  setPref("serp", $("#serp").value.trim()); setPref("city", ($("#city").value.trim() || "cairo").toLowerCase());
  const boxes = [...document.querySelectorAll("#storelist input")];
  const slow = new Set(STORES.filter((x) => x.default_off).map((x) => x.name));
  setPref("disabled", JSON.stringify(boxes.filter((i) => !i.checked && !slow.has(i.dataset.n)).map((i) => i.dataset.n)));
  setPref("enabled", JSON.stringify(boxes.filter((i) => i.checked && slow.has(i.dataset.n)).map((i) => i.dataset.n)));
  $("#sheet").classList.remove("on");
};

// ---------- ⚡ flash deals ----------
let dealsData = null, dealsBusy = false, dealSort = "pct", dealStore = "";
let dealRange = null;   // read from prefs on first use; default 50–70%
const RANGES = { all: [10, 95], r30: [30, 95], r5070: [50, 70], r70: [70, 95] };
const DEALS_TTL = 60 * 60 * 1000;   // reuse fetched deals for 1 hour

function showView(v) {
  $("#searchView").hidden = v !== "search";
  $("#dealsView").hidden = v !== "deals";
  $("#nav_search").classList.toggle("on", v === "search");
  $("#nav_deals").classList.toggle("on", v === "deals");
  window.scrollTo({ top: 0 });
}

function renderDeals(done = true) {
  const t = T[L], d = dealsData;
  if (!d) return;
  const mins = Math.round((Date.now() - d.at) / 60000);
  $("#d_sub").textContent = done ? fmt(t.dealsSub, { n: d.total, t: mins < 1 ? t.justNow : fmt(t.minAgo, { m: mins }) })
    : fmt(t.dealsLoading, { done: d.sources.length, all: d.total });
  if (!dealRange) dealRange = RANGES[pref("dealRange")] ? pref("dealRange") : "r5070";
  const [lo, hi] = RANGES[dealRange];
  $("#d_range").innerHTML = [["all", t.rAll], ["r30", t.r30], ["r5070", t.r5070], ["r70", t.r70]]
    .map(([k, n]) => `<button data-r="${k}" class="${dealRange === k ? "on" : ""}">${n} · ${d.deals.filter((o) => o.pct >= RANGES[k][0] && o.pct <= RANGES[k][1]).length}</button>`).join("");
  const inRange = d.deals.filter((o) => o.pct >= lo && o.pct <= hi);
  const sorts = [["pct", t.sortPct], ["save", t.sortSave], ["price", t.sortPrice]];
  $("#d_sort").innerHTML = sorts.map(([k, n]) => `<button data-k="${k}" class="${dealSort === k ? "on" : ""}">${n}</button>`).join("");
  const counts = {};
  for (const o of inRange) counts[o.source] = (counts[o.source] || 0) + 1;
  $("#d_stores").innerHTML = [["", `${t.allStores} · ${inRange.length}`], ...Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([n, c]) => [n, `${n} · ${c}`])]
    .map(([k, n]) => `<button data-s="${esc(k)}" class="${dealStore === k ? "on" : ""}">${esc(n)}</button>`).join("");
  let list = inRange.filter((o) => !dealStore || o.source === dealStore);
  const by = { pct: (a, b) => b.pct - a.pct, save: (a, b) => (b.old_price - b.price) - (a.old_price - a.price), price: (a, b) => a.price - b.price };
  list = list.slice().sort(by[dealSort]).slice(0, 120);
  if (!list.length) { $("#d_out").innerHTML = done ? `<div class="empty">${d.deals.length ? t.rNone : t.dealsNone}</div>` : ""; return; }
  $("#d_out").innerHTML = `<div class="dg">${list.map((o) => `<a class="dc" href="${esc(o.url)}"><span class="off">-${o.pct}%</span>${img(o)}
    <div class="ttl">${esc(o.title)}</div><div class="p">${money(o.price)}</div><div class="old">${money(o.old_price)}</div>
    <div class="src">${esc(o.source)}</div></a>`).join("")}</div>`;
}

async function loadDeals(force) {
  if (dealsBusy) return;
  if (!force && dealsData && Date.now() - dealsData.at < DEALS_TTL) return renderDeals();
  if (!force && !dealsData) {
    try { const c = JSON.parse(pref("dealsCache", "null")); if (c && Date.now() - c.at < DEALS_TTL) { dealsData = c; return renderDeals(); } } catch (_) {}
  }
  dealsBusy = true; $("#d_bar").hidden = false; $("#d_refresh").disabled = true;
  try {
    dealsData = await Arkhas.deals({ stores: STORES.filter(isOn), fetcher, onProgress: (r) => {
      dealsData = r; renderDeals(false);
      $("#d_bar i").style.width = Math.max(8, (100 * r.sources.length) / r.total) + "%";
    } });
    renderDeals(true);
    try { setPref("dealsCache", JSON.stringify(dealsData)); } catch (_) {}
  } finally { dealsBusy = false; $("#d_bar").hidden = true; $("#d_refresh").disabled = false; }
}

$("#nav_deals").onclick = () => { showView("deals"); loadDeals(false); };
$("#d_refresh").onclick = () => loadDeals(true);
$("#d_range").onclick = (e) => { const k = e.target.dataset && e.target.dataset.r; if (k) { dealRange = k; setPref("dealRange", k); dealStore = ""; renderDeals(); } };
$("#d_sort").onclick = (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) { dealSort = k; renderDeals(); } };
$("#d_stores").onclick = (e) => { const k = e.target.dataset ? e.target.dataset.s : undefined; if (k !== undefined) { dealStore = k; renderDeals(); } };

// ---------- in-app update (needs app 1.0.6+; hidden on older apps) ----------
const canUpdate = !!(N && N.checkUpdate && N.installUpdate);   // 1.0.6+: download + install inside the app
const canLink = !!(N && N.appVersion) && !canUpdate;             // older apps: check GitHub, open download page
const REPO = "MuhammadToffaha/arkhas";
let updInfo = null;
function showUpd(msgKey, vars) {
  const t = T[L];
  $("#u_title").textContent = t.upd;
  $("#u_cur").textContent = fmt(t.cur, { v: N.appVersion() });
  $("#u_check").textContent = t.check; $("#u_web").textContent = t.webBtn;
  $("#u_web").hidden = !canUpdate;
  const has = updInfo && updInfo.available;
  $("#upd").classList.toggle("new", !!has);
  $("#dot").hidden = !has;
  $("#newver").hidden = !has;
  if (has) $("#newver").textContent = fmt(t.banner, { v: updInfo.latestName });
  $("#u_install").hidden = !has;
  if (has) $("#u_install").textContent = fmt(canUpdate ? t.install : t.openRel, { v: updInfo.latestName });
  if (msgKey) $("#u_msg").textContent = fmt(t[msgKey], vars || {});
  else if (updInfo) $("#u_msg").textContent = has ? fmt(t.newVer, { v: updInfo.latestName, mb: (updInfo.size / 1048576).toFixed(1) }) + (canLink ? " — " + t.relNote : "") : t.latest;
}
/** Older apps: read the latest GitHub release through the normal fetch bridge. */
async function linkCheck() {
  const rel = JSON.parse(await fetcher(`https://api.github.com/repos/${REPO}/releases/latest`, { json: true }));
  const latest = parseInt(String(rel.tag_name).replace(/^v/, ""), 10) || 0;
  const cur = parseInt(String(N.appVersion()).split(".").pop(), 10) || 0;
  const apk = (rel.assets || []).find((x) => /\.apk$/.test(x.name)) || {};
  return { latest, latestName: "1.0." + latest, url: apk.browser_download_url || rel.html_url, size: apk.size || 0, available: latest > cur };
}
async function checkUpd(force) {
  if (!canUpdate && !canLink) return;
  if (force) { $("#u_check").disabled = true; showUpd("checking"); }
  try { updInfo = canUpdate ? JSON.parse(await call("checkUpdate", !!force)) : await linkCheck(); showUpd(); }
  catch (e) { if (force) showUpd("updErr", { e: e.message }); }
  finally { $("#u_check").disabled = false; }
}
window.__updProgress = (p) => {
  $("#u_bar").hidden = false;
  $("#u_bar i").style.width = (p < 0 ? 50 : p) + "%";
  $("#u_msg").textContent = fmt(T[L].downloading, { p: p < 0 ? "…" : p });
};
$("#newver").onclick = () => $("#gear").click();
if (canLink) {
  $("#upd").hidden = false;
  $("#u_check").onclick = () => checkUpd(true);
  // old app: links open outside the app -> the browser downloads the APK, Android installs it
  $("#u_install").onclick = () => { location.href = updInfo.url; };
}
if (canUpdate) {
  $("#upd").hidden = false;
  $("#u_check").onclick = () => checkUpd(true);
  $("#u_install").onclick = async () => {
    $("#u_install").disabled = true;
    try {
      const r = await call("installUpdate", updInfo.url);
      showUpd(r === "need-permission" ? "perm" : "installing");
    } catch (e) { showUpd("updErr", { e: e.message }); }
    finally { $("#u_install").disabled = false; $("#u_bar").hidden = true; }
  };
  $("#u_web").onclick = async () => {
    $("#u_web").disabled = true;
    try { showUpd((await call("refreshWeb")) === "changed" ? "webChanged" : "webSame"); }
    catch (e) { showUpd("updErr", { e: e.message }); }
    finally { $("#u_web").disabled = false; }
  };
}

// ---------- boot ----------
window.arkhasReady = (async () => {
  applyLang();
  try {
    Arkhas.setSynonyms(JSON.parse(await readConfig("synonyms.json")));
    STORES = JSON.parse(await readConfig("stores.json"));
  } catch (e) { $("#out").innerHTML = `<div class="empty">⚠️ config: ${esc(e.message)}</div>`; }
  const q = new URLSearchParams(location.search).get("q") || (N && N.pendingQuery ? N.pendingQuery() : "");
  if (q) run(q); else $("#q").focus();
  checkUpd(false);   // quiet check (cached 6 h) -> red dot on ⚙️ when a new version exists
})();
</script>
</body>
