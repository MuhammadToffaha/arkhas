<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- bump when this page needs new native bridge methods; old apps then keep their bundled copy -->
<meta name="arkhas-bridge" content="1">
<title>أرخص · Arkhas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1a16;--muted:#6f685d;--line:#e4ddcf;--accent:#0e7a5f;--accent-ink:#fff;--warn:#b25b00;--gold:#c9961a;--silver:#8d949c;--bronze:#a8673a}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--card:#1e1c17;--ink:#f1ece2;--muted:#a59d8f;--line:#33302a;--accent:#2fb38c;--accent-ink:#0b1410;--warn:#f0a24a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:26px;font-weight:800}
.logo small{font-size:13px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0001}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px}
.nav button b{font-size:21px;line-height:1.2;font-weight:400}
.nav button:active{background:var(--line)}
.nav button.on{color:var(--accent);font-weight:600}
form{display:flex;gap:8px;margin:16px 0 6px}
.qbox{flex:1;min-width:0;position:relative;display:flex}
.qbox input{padding-inline-end:40px}
.qbox input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:14px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.go{font:inherit;font-weight:700;font-size:16px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted);font-size:13px}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px;background:var(--card);font-size:13px}
.podium{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.pc{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;color:inherit;text-decoration:none}
.pc.r1{border-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.medal{font-size:26px;flex:none;width:30px;text-align:center}
.pc img,.row img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.pc .t{flex:1;min-width:0}
.ttl{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px}
.src{font-size:12.5px;color:var(--muted)}
.p{font-weight:800;font-size:19px;white-space:nowrap;color:var(--accent)}
.old{font-size:12px;color:var(--muted);text-decoration:line-through}
.save{font-size:12px;color:var(--accent);font-weight:600}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:inherit;text-decoration:none;margin-bottom:6px}
.row img{width:46px;height:46px}.row .t{flex:1;min-width:0}.row .p{font-size:15px;color:var(--ink)}
.nav button.flash b{filter:drop-shadow(0 0 4px #ffb300aa)}
.nav button.flash.on{color:#d97706}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.dt{margin:0;font-size:22px;font-weight:800}
.bolt{display:inline-block;animation:zap 1.6s ease-in-out infinite}
@keyframes zap{0%,100%{transform:scale(1)}50%{transform:scale(1.18) rotate(-8deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#d_range button.on{background:#e0412f;border-color:#e0412f;color:#fff}
#d_range button.mega{border-color:#f5c400}
#d_range button.mega.on{background:#feee00;border-color:#feee00;color:#1d1a16}
.dc.is-mega{border-color:#f5c400;box-shadow:0 0 0 1px #f5c40066}
.megab{position:absolute;top:8px;inset-inline-start:8px;margin-top:26px;background:#feee00;color:#1d1a16;font-weight:800;font-size:11px;padding:2px 7px;border-radius:8px}
.dref{display:flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:16px;padding:10px 18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);min-height:48px}
.dref b{font-size:24px;line-height:1;display:inline-block}
.dref:disabled b{animation:spin 1s linear infinite}.dref:disabled{opacity:.75}
@keyframes spin{to{transform:rotate(360deg)}}
.dref.wa{background:#25d366;color:#fff}
.share{position:absolute;z-index:2;top:44px;inset-inline-end:6px;width:34px;height:34px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:15px;line-height:34px;padding:0;box-shadow:0 1px 4px #0002}
.dd{position:relative;margin-top:10px}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:15px;font-weight:600;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.dd-btn i{font-style:normal;color:var(--muted)}
.dd-panel{position:absolute;z-index:6;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #0003;max-height:55vh;overflow:auto;padding:6px 10px 10px}
.dd-top{display:flex;gap:8px;padding:6px 0 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dd-top button{flex:1;font:inherit;font-size:13px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dd-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.dd-row:last-child{border-bottom:0}
.dd-row input{width:20px;height:20px;accent-color:var(--accent)}
.dd-row .c{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.pc,.row,.dc{position:relative}
.noimg{display:flex;align-items:center;justify-content:center;width:64px;height:64px;flex:none;border-radius:10px;background:var(--line);font-size:26px;opacity:.7}
.row .noimg{width:46px;height:46px;font-size:20px}
.dc .noimg{width:100%;height:120px;font-size:40px}
.fav{position:absolute;z-index:2;top:6px;inset-inline-end:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card);box-shadow:0 1px 4px #0002;font-size:17px;line-height:34px;padding:0;color:#c9c2b6}
.fav.on{color:#e0412f}
.row .fav{top:50%;transform:translateY(-50%);width:30px;height:30px;line-height:30px;font-size:15px}
.pc .fav{top:-10px;inset-inline-end:-6px}
.row{padding-inline-end:44px}
.cnt{position:absolute;top:-4px;inset-inline-end:-10px;min-width:16px;height:16px;border-radius:8px;background:#e0412f;color:#fff;font-size:10px;font-style:normal;line-height:16px;padding:0 4px;font-weight:700}
.fr{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;color:inherit;text-decoration:none;position:relative}
.fr img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.fr .t{flex:1;min-width:0}
.fr .fav{position:static;transform:none;box-shadow:none;background:none;color:var(--muted);font-size:18px;width:36px;height:36px;flex:none}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;color:inherit;text-decoration:none}
.dc img{width:100%;height:120px;object-fit:contain;border-radius:10px;background:#fff}
.dc .off{position:absolute;top:8px;inset-inline-start:8px;background:#e0412f;color:#fff;font-weight:800;font-size:13px;padding:2px 8px;border-radius:8px}
.dc .ttl{font-size:13px;margin-top:6px;flex:1}
.dc .p{font-size:16px;margin-top:4px}
.dc .src{margin-top:2px}
.newver{display:block;width:100%;margin:10px 0 4px;padding:11px 14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px;text-align:start}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;top:3px;inset-inline-start:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:before{transform:translateX(20px)}
[dir=rtl] .sw input:checked+i:before{transform:translateX(-20px)}
.lockrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.lockbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.lockbox input{width:100%;font-size:22px;letter-spacing:8px;text-align:center;padding:10px;margin-top:6px}
.relock{margin-inline-start:auto;padding:4px 10px}
.tg-steps{padding-inline-start:18px;margin:6px 0;line-height:1.7}
#tg_box input{margin-top:8px;font-size:14px;padding:10px 12px;width:100%}
#tg_chats button{display:block;width:100%;text-align:start;margin-top:6px}
.al-l{font-size:13px;font-weight:600;margin-top:10px}
#al_min button.on,#al_st button.on,#al_h button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;font:inherit;font-size:15px;padding:10px;border:0;background:none;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.st .sx{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.upd{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 8px}
.upd.new{border-color:var(--accent)}
.upd-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.upd-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.upd-b .go{padding:10px 16px}
.ib2{font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ib2:disabled,.go:disabled{opacity:.5}
.nav b{position:relative}.dot{position:absolute;top:0;inset-inline-end:-4px;width:9px;height:9px;border-radius:50%;background:#e0412f;border:2px solid var(--card)}
.mb{font-size:11px;font-weight:700;border-radius:6px;padding:0 5px}.mb.ex{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.mb.si{color:var(--muted);border:1px solid var(--line)}
.flag{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 5px;margin-inline-start:4px}
h3{margin:22px 0 8px;font-size:15px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
details{margin-top:14px}summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:12.5px}td{padding:4px;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;margin:36px 0}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}.sheet>div{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.sheet input{font-size:15px;padding:10px 12px;width:100%}
.st{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.st input{width:auto;flex:none}

/* ===== 🎨 Trendy deal-app themes (Settings → theme). data-theme on <html>; default "hot". ===== */
:root,[data-theme=hot]{--bg:#fff4f1;--card:#ffffff;--ink:#1c1217;--muted:#7d6a72;--line:#f3dfe0;--accent:#ff2d63;--accent-ink:#fff;
  --g1:#ff6a2b;--g2:#ff2d75;--grad:linear-gradient(120deg,var(--g1),var(--g2));--hot:#ff2d55;--glow:#ff2d6340;--hero-ink:#fff}
[data-theme=neon]{--bg:#f4f1ff;--card:#fff;--ink:#16122a;--muted:#6e6890;--line:#e3ddfa;--accent:#7b2ff7;--accent-ink:#fff;
  --g1:#7b2ff7;--g2:#00b4ff;--hot:#ff2bd6;--glow:#7b2ff740;--hero-ink:#fff}
[data-theme=sun]{--bg:#fffbea;--card:#fff;--ink:#141414;--muted:#6b6658;--line:#f1e8c3;--accent:#141414;--accent-ink:#ffd60a;
  --g1:#ffd60a;--g2:#ffb100;--hot:#ff3b30;--glow:#ffb10040;--hero-ink:#141414}
[data-theme=mint]{--bg:#effaf6;--card:#fff;--ink:#0f1f1a;--muted:#5e7068;--line:#d6ece4;--accent:#00a676;--accent-ink:#fff;
  --g1:#00c389;--g2:#00897b;--hot:#ff4d4f;--glow:#00a67640;--hero-ink:#fff}
@media (prefers-color-scheme:dark){
  :root,[data-theme=hot]{--bg:#120c10;--card:#1e151b;--ink:#fbeff3;--muted:#b39aa6;--line:#3a2731;--accent:#ff4d7d;--glow:#ff2d6355}
  [data-theme=neon]{--bg:#0d0b1a;--card:#18152c;--ink:#eeeaff;--muted:#a39dc6;--line:#2e2950;--accent:#9d6bff;--glow:#7b2ff766}
  [data-theme=sun]{--bg:#121108;--card:#1d1b10;--ink:#fff8d6;--muted:#b3ab86;--line:#373218;--accent:#ffd60a;--accent-ink:#141414}
  [data-theme=mint]{--bg:#08130f;--card:#12201b;--ink:#e6fff6;--muted:#93b3a7;--line:#22382f;--accent:#2fe0a8;--accent-ink:#06130e}}
:root{--grad:linear-gradient(120deg,var(--g1),var(--g2))}
body{font-family:"Cairo","Tajawal",system-ui,"Noto Sans Arabic",sans-serif}
header{margin:calc(-12px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 20px;
  background:var(--grad);color:var(--hero-ink);border-radius:0 0 26px 26px;box-shadow:0 10px 28px var(--glow);position:relative;overflow:hidden}
header:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff22;top:-70px;inset-inline-end:-40px}
header:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#ffffff18;bottom:-40px;inset-inline-start:30%}
.logo{font-size:28px;letter-spacing:-.5px;position:relative;z-index:1}
.logo small{color:inherit;opacity:.85}
form{margin-top:-2px;position:relative;z-index:1}
#searchView form{margin-top:16px}
input{border-radius:16px;border-width:1.5px;box-shadow:0 2px 10px #0000000d}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.go,.dref,.newver{background:var(--grad);color:var(--hero-ink);box-shadow:0 6px 18px var(--glow);border-radius:16px}
.go:active,.dref:active{transform:scale(.97)}
.bar i{background:var(--grad)}
.p{color:var(--hot)}
.save{color:var(--hot)}
.pc{border:0;border-radius:20px;box-shadow:0 4px 18px #0000000f}
.pc.r1{box-shadow:0 0 0 2px var(--accent),0 8px 22px var(--glow)}
.row,.fr,.links a,.upd,.dd-btn{border-color:transparent;box-shadow:0 2px 12px #0000000c}
.chips button{border-radius:999px;font-weight:600;padding:7px 14px;box-shadow:0 1px 4px #0000000a}
.chips button.on,#d_range button.on,#al_min button.on,#al_st button.on,#al_h button.on,.seg button.on{background:var(--grad);border-color:transparent;color:var(--hero-ink);box-shadow:0 4px 12px var(--glow)}
#d_range button.mega.on{background:#feee00;color:#1d1a16}
.dt{font-size:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dg{gap:12px}
.dc{border:0;border-radius:18px;padding:8px;box-shadow:0 4px 16px #00000012;overflow:hidden;transition:transform .15s}
.dc:active{transform:scale(.98)}
.dc img{height:130px;border-radius:14px}
.dc .off{background:linear-gradient(135deg,var(--hot),#ff8a00);font-size:14px;padding:3px 10px;border-radius:10px 4px 10px 4px;box-shadow:0 3px 10px #ff2d5540}
.dc .off:before{content:"🔥 "}
.dc .p{font-size:17px}
.fav,.share{box-shadow:0 2px 8px #0000001f}
.fav.on,.cnt,.dot{color:var(--hot)}.cnt,.dot{background:var(--hot);color:#fff}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px;box-shadow:0 10px 30px #0000002a}
.nav button{border-radius:18px;transition:background .2s}
.nav button.on{color:var(--accent)}
.nav button.on b{background:var(--grad);border-radius:14px;padding:0 14px;filter:none;box-shadow:0 4px 12px var(--glow)}
.nav button.flash.on{color:var(--accent)}
.sw input:checked+i{background:var(--grad)}
.sheet>div{border-radius:26px 26px 0 0}
[hidden]{display:none!important}
#d_quick button.big{border-color:var(--accent);font-weight:800}
.bigb{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:0 5px}

.cam{flex:none;width:50px;border:0;border-radius:16px;background:var(--card);font-size:22px;box-shadow:0 2px 10px #0000001a}
.photo{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:10px;margin:8px 0;box-shadow:0 2px 12px #0000000c}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:14px;flex:none;background:var(--line)}
.ph_t{flex:1;min-width:0}.ph_chips{padding-top:6px;flex-wrap:wrap}
.ph_b{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.ph_b .ib2{padding:6px 10px;font-size:13px}
#camsheet .popb{display:flex;gap:8px;margin-top:14px}#camsheet .popb button{flex:1;padding:12px}

.promo{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:10px;margin-top:10px;box-shadow:0 2px 12px #0000000c}
.promo .pl{width:52px;height:52px;flex:none;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px}
.promo .pl img{width:100%;height:100%;object-fit:contain}
.promo .pt{flex:1;min-width:0}.promo .pt b{font-size:15px}
.promo .pb{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.pcode{font:inherit;font-weight:900;font-size:15px;letter-spacing:1px;border:2px dashed var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:12px;padding:6px 10px;min-width:88px}
.pcode.ok{border-style:solid;background:#16a34a;border-color:#16a34a;color:#fff;letter-spacing:0}

// ---------- render ----------
// product picture; if missing or it fails to load, a neutral placeholder keeps the card layout
const img = (o) => o.image
  ? `<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=noimg>🛍️</span>'">`
  : `<span class="noimg">🛍️</span>`;
const flags = (o) => o.flags.map((f) => `<span class="flag">${f === "possible-accessory" ? T[L].acc : f === "other-model" ? T[L].other : T[L].cheap}</span>`).join("");
const badge = (o) => `<span class="mb ${o.match === 0 ? "ex" : "si"}">${o.match === 0 ? T[L].exact : T[L].similar}</span>`;

function render(r, done) {
  const t = T[L]; let h = "";
  h += `<div class="muted">${t.searched} ${r.variants.map((v) => `<span class="chip">${esc(v)}</span>`).join("")}</div>`;
  if (r.top3.length) {
    h += `<h3>${t.top}</h3>`;
    const nExact = r.top3.filter((o) => o.match === 0).length;
    if (done && nExact < r.top3.length && nExact < 3) h += `<div class="muted">${fmt(t.fewExact, { n: nExact })}</div>`;
    h += `<div class="podium">`;
    r.top3.forEach((o, i) => {
      const off = o.old_price && o.old_price > o.price ? `<div class="old">${money(o.old_price)}</div><div class="save">${fmt(t.save, { n: money(o.old_price - o.price) })}</div>` : "";
      h += `<a class="pc r${i + 1}" href="${esc(o.url)}">${heart(o)}${cartBtn(o)}<div class="medal">${["🥇", "🥈", "🥉"][i]}</div>${img(o)}
        <div class="t"><div class="ttl">${esc(o.title)}</div><div class="src">${badge(o)} ${esc(o.source)}${flags(o)}</div></div>
        <div style="text-align:end"><div class="p">${money(o.price)}</div>${off}</div></a>`;
    });
    h += `</div>`;
  } else h += `<div class="empty">${done ? t.noneDone : t.none}</div>`;

  const rest = r.offers.filter((o) => !r.top3.includes(o));
  if (rest.length) {
    h += `<details><summary>${fmt(t.all, { n: r.offers.length })}</summary>`;
    for (const o of rest) h += `<a class="row" href="${esc(o.url)}">${heart(o)}${cartBtn(o)}${img(o)}<div class="t"><div class="ttl">${esc(o.title)}</div>
      <div class="src">${badge(o)} ${esc(o.source)}${flags(o)}</div></div><div class="p">${money(o.price)}</div></a>`;
    h += `</details>`;
  }
  if (done && r.hidden) h += `<div class="muted">${fmt(t.hidden, { n: r.hidden })}</div>`;

  h += `<h3>${t.fb}</h3><div class="links">${r.links.map((l) => `<a href="${esc(l.url)}">${esc(l.name)}</a>`).join("")}</div>`;
  const srcs = r.sources.slice().sort((a, b) => b.count - a.count || a.ms - b.ms);
  h += `<details id="status"${statusOpen ? " open" : ""}><summary>${t.src} · ${srcs.filter((x) => x.count).length}/${r.total || srcs.length}</summary><table>${srcs.map((s) =>
    `<tr><td>${s.count ? "✅" : s.ok ? "➖" : "⚠️"} ${esc(s.source)}</td><td>${s.count}</td><td>${(s.ms / 1000).toFixed(1)}s</td>` +
    `<td>${esc(s.error || (s.query && s.query !== r.query ? "→ " + s.query : ""))}</td></tr>`).join("")}</table></details>`;
  const st = document.getElementById("status");
  if (st) statusOpen = st.open;
  $("#out").innerHTML = h;
  const st2 = document.getElementById("status");
  if (st2) st2.ontoggle = () => { statusOpen = st2.open; };
}
let statusOpen = false;

// stores marked default_off (slow, JS-only sites) stay off until switched on in ⚙️
function isOn(s) {
  if (s.enabled === false) return false;
  return s.default_off ? JSON.parse(pref("enabled", "[]")).includes(s.name) : !JSON.parse(pref("disabled", "[]")).includes(s.name);
}

function progress(r) {
  $("#bar").hidden = false;
  $("#bar i").style.width = Math.max(8, (100 * r.sources.length) / total) + "%";
  $("#hint").textContent = fmt(T[L].searching, { done: r.sources.length, all: total });
}

// ---------- search ----------
async function run(q) {
  q = (q || "").trim(); if (q.length < 2 || busy) return;
  $("#q").value = q; syncX(); $("#q").blur(); busy = true; $("#out").innerHTML = "";
  const stores = STORES.filter(isOn);
  const serpKey = pref("serp");
  total = stores.length + (serpKey ? 1 : 0);
  progress({ sources: [] });
  try {
    last = await Arkhas.search(q, { stores, fetcher, serpKey, city: pref("city", "cairo"),
      onProgress: (r) => { last = r; render(r, false); progress(r); } });
    render(last, true);
  } catch (e) { $("#out").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`; }
  finally { busy = false; $("#bar").hidden = true; $("#hint").textContent = T[L].hint; }
}
window.arkhasSearch = (q) => { showView("search"); return run(q); };  // called by the app for Share / text-selection searches
$("#f").onsubmit = (e) => { e.preventDefault(); run($("#q").value); };

let tgUnlocked = false;
async function pinHash(pin) {
  const str = "arkhas-tg:" + pin;
  const data = typeof TextEncoder !== "undefined" ? new TextEncoder().encode(str)
    : Uint8Array.from(unescape(encodeURIComponent(str)), (c) => c.charCodeAt(0));
  if (window.crypto && crypto.subtle) {
    const h = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let x = 5381; for (const b of data) x = ((x * 33) ^ b) >>> 0; return "djb2:" + x.toString(16);   // fallback
}

  $("#tg_pin").value = ""; $("#tg_pin_box").hidden = false; $("#tg_pin").focus();

  if (!/^\d{4,8}$/.test(v)) { $("#tg_pin_msg").textContent = t.pinShort; return; }
  if (pinStage === "enter") {
    if ((await pinHash(v)) !== pref("tgPin")) { $("#tg_pin_msg").textContent = t.pinWrong; $("#tg_pin").value = ""; return; }
  } else if (pinStage === "new") { pinFirst = v; pinStage = "again"; $("#tg_pin").value = ""; $("#tg_pin_msg").textContent = t.pinAgain; return; }
  else if (pinStage === "again") {
    if (v !== pinFirst) { pinStage = "new"; pinFirst = ""; $("#tg_pin").value = ""; $("#tg_pin_msg").textContent = t.pinMismatch; return; }
    setPref("tgPin", await pinHash(v));

}

  const builtIn = !!(N && N.defaultTgToken && N.defaultTgToken());
  $("#tg_token").hidden = builtIn;                 // built-in bot: nothing to paste
  if (builtIn) $("#tg_steps").innerHTML = t.tgStepsBuiltIn.map((x) => `<li>${esc(x)}</li>`).join("");
  if (document.activeElement !== $("#tg_token")) $("#tg_token").value = builtIn ? "" : c.tg.token;
  if (document.activeElement !== $("#tg_chat")) $("#tg_chat").value = c.tg.chat;
  if (c.tg.chat && !$("#tg_msg").dataset.busy) $("#tg_msg").textContent = fmt(t.tgPicked, { t: (String(c.tg.chat).startsWith("-") ? "👥 " : "📩 ") + (c.tg.title || c.tg.chat) });
  let last = null; try { last = JSON.parse(pref("alertLast", "null")); } catch (_) {}
  const when = last ? new Date(last.at).toLocaleString(L === "ar" ? "ar-EG" : "en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
  $("#al_last").textContent = (c.on && N.canNotify && !N.canNotify() ? t.alPerm + " · " : "") +
    (!last ? t.alNever : last.error ? fmt(t.alErr, { t: when, e: last.error }) : fmt(t.alLast, { t: when, f: last.found || 0, n: last.new || 0 })) +
    (last && last.tgSent != null ? fmt(t.tgSent, { n: last.tgSent }) : "") + (last && last.tgError ? fmt(t.tgFail, { e: last.tgError }) : "");
}
if (canAlert) {
  $("#al_on").onchange = () => { const c = alCfg(); c.on = $("#al_on").checked; saveAl(c); };
  $("#al_mega").onchange = () => { const c = alCfg(); c.mega = $("#al_mega").checked; saveAl(c); };
  $("#al_min").onclick = (e) => { const m = +((e.target.dataset || {}).m || 0); if (m) { const c = alCfg(); c.min = m; saveAl(c); } };
  $("#al_h").onclick = (e) => { const h = +((e.target.dataset || {}).h || 0); if (h) { const c = alCfg(); c.hours = h; saveAl(c); } };
  $("#al_st").onclick = (e) => { const n = (e.target.dataset || {}).s; if (!n) return; const c = alCfg();
    c.stores = c.stores.includes(n) ? c.stores.filter((x) => x !== n) : c.stores.concat(n);
    if (!c.stores.length) c.stores = [n]; saveAl(c); };
  $("#al_test").onclick = () => { N.testAlerts(); $("#al_last").textContent = T[L].alTesting; };
  $("#al_notify").onchange = () => { const c = alCfg(); c.notify = $("#al_notify").checked; saveAl(c); };
  $("#tg_on").onchange = () => { const c = alCfg(); c.tg.on = $("#tg_on").checked; saveAl(c); };
  $("#tg_token").onchange = () => { const c = alCfg(); c.tg.token = $("#tg_token").value.trim(); saveAl(c); };
  $("#tg_chat").onchange = () => { const c = alCfg(); c.tg.chat = $("#tg_chat").value.trim(); c.tg.title = ""; c.tg.private = !c.tg.chat.startsWith("-"); saveAl(c); };
  const tgApi = async (method, params) => {
    const tok = alCfg().tg.token || $("#tg_token").value.trim() || (N && N.defaultTgToken ? N.defaultTgToken() : "");
    const qs = new URLSearchParams(params || {}).toString();
    let d;
    try { d = JSON.parse(await fetcher(`https://api.telegram.org/bot${tok}/${method}${qs ? "?" + qs : ""}`, { json: true })); }
    catch (e) { d = { ok: false, description: /401|404/.test(e.message) ? "bot token wrong" : e.message }; }
    if (!d.ok) throw new Error(d.description || "error");
    return d.result;
  };
  const tgMsg = (x) => { $("#tg_msg").textContent = x; $("#tg_msg").dataset.busy = "1"; };
  /** groups the bot has seen: added-to-group events, /commands, channel posts (deleteWebhook first: a webhook blocks getUpdates) */
  const tgChats = async () => {
    try { await tgApi("deleteWebhook"); } catch (_) {}
    const ups = await tgApi("getUpdates", { limit: "100", allowed_updates: JSON.stringify(["message", "my_chat_member", "channel_post", "chat_member"]) });
    const chats = new Map();
    for (const u of ups) for (const x of [u.message, u.my_chat_member, u.channel_post, u.chat_member]) {
      const ch = x && x.chat;
      const left = x && x.new_chat_member && ["left", "kicked"].includes(x.new_chat_member.status);
      if (ch) { const name = ch.type === "private" ? "📩 " + (ch.first_name || "") + " (" + T[L].tgPrivate + ")" : ch.title || String(ch.id);
        if (left) chats.delete(String(ch.id)); else if (!chats.has(String(ch.id)) || ch.type !== "private") chats.set(String(ch.id), name); }
      // group upgraded to supergroup -> new id
      if (x && x.migrate_to_chat_id) { chats.delete(String(ch.id)); chats.set(String(x.migrate_to_chat_id), ch.title || String(x.migrate_to_chat_id)); }
    }
    return chats;
  };
  const tgCheckToken = async () => {
    const c = alCfg(); if (!$("#tg_token").hidden && $("#tg_token").value.trim()) { c.tg.token = $("#tg_token").value.trim(); saveAl(c); }
    try { const me = await tgApi("getMe"); $("#tg_bot").textContent = fmt(T[L].tgBot, { u: me.username }); return me; }
    catch (e) { $("#tg_bot").textContent = ""; tgMsg(T[L].tgBadTok); return null; }
  };
  const showChats = (chats) => {
    $("#tg_chats").innerHTML = [...chats].sort((a, b) => (a[0].startsWith("-") ? 0 : 1) - (b[0].startsWith("-") ? 0 : 1)).map(([id, title]) => `<button class="ib2" data-id="${esc(id)}" data-t="${esc(title)}">👥 ${esc(title)}</button>`).join("");
  };
  $("#tg_find").onclick = async () => {
    $("#tg_chats").innerHTML = ""; tgMsg("…");
    if (!(await tgCheckToken())) return;
    try { const chats = await tgChats(); if (!chats.size) return tgMsg(T[L].tgNoChats); tgMsg(""); showChats(chats); }
    catch (e) { tgMsg(fmt(T[L].tgErr, { e: e.message })); }
  };
  let tgPoll = null;
  $("#tg_add").onclick = async () => {
    $("#tg_chats").innerHTML = "";
    const me = await tgCheckToken(); if (!me) return;
    const before = new Set((await tgChats().catch(() => new Map())).keys());
    // Telegram's own "add this bot to a group" screen; admin rights let it post
    const link = `https://t.me/${me.username}?startgroup=arkhas&admin=post_messages`;
    if (window.__openExt) window.__openExt(link); else location.href = link;
    tgMsg(T[L].tgWaiting);
    clearInterval(tgPoll);
    let tries = 0;
    tgPoll = setInterval(async () => {
      tries++;
      try {
        const chats = await tgChats();
        const fresh = [...chats].filter(([id]) => !before.has(id) && !id.match(/^\d/));   // new groups only (group ids are negative)
        const pick = fresh.length === 1 ? fresh[0] : null;
        if (pick) {
          clearInterval(tgPoll);
          const c = alCfg(); c.tg.chat = pick[0]; c.tg.title = pick[1]; c.tg.private = false; c.tg.on = true; saveAl(c);
          delete $("#tg_msg").dataset.busy; renderAl();
          $("#tg_test").click();            // say hello in the group right away
        } else if (fresh.length > 1 || (tries > 3 && chats.size)) { clearInterval(tgPoll); tgMsg(""); showChats(fresh.length ? new Map(fresh) : chats); }
      } catch (_) {}
      if (tries >= 40) { clearInterval(tgPoll); tgMsg(T[L].tgTimeout); }
    }, 3000);
  };
  $("#tg_chats").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const c = alCfg(); c.tg.chat = b.dataset.id; c.tg.title = b.dataset.t; c.tg.private = !b.dataset.id.startsWith("-"); saveAl(c);
    $("#tg_chats").innerHTML = ""; delete $("#tg_msg").dataset.busy; renderAl();
  };
  $("#tg_test").onclick = async () => {
    const c = alCfg(); c.tg.chat = $("#tg_chat").value.trim() || c.tg.chat; saveAl(c);
    tgMsg("…");
    try { await tgApi("sendMessage", { chat_id: c.tg.chat, text: T[L].tgTestText }); tgMsg(T[L].tgOk); }
    catch (e) { tgMsg(fmt(T[L].tgErr, { e: e.message })); }
  };
}

/** Background mode: the phone runs this page invisibly every few hours to look for big new deals. */
async function runBackgroundWatch() {
  const c = alCfg();
  let r = { deals: [], sources: [] };
  try {
    r = await Arkhas.deals({ stores: STORES.filter((s) => s.deals && c.stores.includes(s.name)), fetcher,
      minPct: Math.min(c.min, 40), perStore: 60 });
  } catch (e) { r.error = String(e && e.message || e); }
  const pick = r.deals.filter((o) => o.pct >= c.min || (c.mega && o.tag === "mega"));
  N.bgDone(JSON.stringify({ deals: pick.map((o) => ({ title: o.title, price: o.price, old_price: o.old_price || null, url: o.url,
    image: o.image || null, source: o.source, pct: o.pct || 0, tag: o.tag || null })),
    sources: r.sources.map((s) => ({ source: s.source, count: s.count, error: s.error })) }));
}
window.arkhasOpen = (v) => { if (v === "deals") { showView("deals"); loadDeals(false); } };

// ---------- in-app update (needs app 1.0.6+; hidden on older apps) ----------
const canUpdate = !!(N && N.checkUpdate && N.installUpdate);   // 1.0.6+: download + install inside the app
const canLink = !!(N && N.appVersion) && !canUpdate;             // older apps: check GitHub, open download page
const REPO = "MuhammadToffaha/arkhas";
let updInfo = null;
function showUpd(msgKey, vars) {
  const t = T[L];
  $("#u_title").textContent = t.upd;
  $("#u_cur").textContent = fmt(t.cur, { v: N.appVersion() });
  $("#u_check").textContent = t.check; $("#u_web").textContent = t.webBtn;
  $("#u_web").hidden = !canUpdate;
  const has = updInfo && updInfo.available;
  $("#upd").classList.toggle("new", !!has);
  $("#dot").hidden = !has;
  $("#newver").hidden = !has;
  if (has) $("#newver").textContent = fmt(t.banner, { v: updInfo.latestName });
  $("#u_install").hidden = !has;
  if (has) $("#u_install").textContent = fmt(canUpdate ? t.install : t.openRel, { v: updInfo.latestName });
  if (N.setAutoUpdate) {
    $("#u_auto_row").hidden = false;
    $("#u_auto_l").textContent = t.autoUpd; $("#u_auto_d").textContent = t.autoUpdD;
    $("#u_auto").checked = pref("autoUpd", "1") !== "0";
  }
  if (msgKey) $("#u_msg").textContent = fmt(t[msgKey], vars || {});
  else if (updInfo) $("#u_msg").textContent = has ? fmt(t.newVer, { v: updInfo.latestName, mb: (updInfo.size / 1048576).toFixed(1) }) + (canLink ? " — " + t.relNote : "") : t.latest;
}
/** Older apps: read the latest GitHub release through the normal fetch bridge. */
async function linkCheck() {
  const rel = JSON.parse(await fetcher(`https://api.github.com/repos/${REPO}/releases/latest`, { json: true }));
  const latest = parseInt(String(rel.tag_name).replace(/^v/, ""), 10) || 0;
  const cur = parseInt(String(N.appVersion()).split(".").pop(), 10) || 0;
  const apk = (rel.assets || []).find((x) => /\.apk$/.test(x.name)) || {};
  return { latest, latestName: "1.0." + latest, url: apk.browser_download_url || rel.html_url, size: apk.size || 0, available: latest > cur };
}
async function checkUpd(force) {
  if (!canUpdate && !canLink) return;
  if (force) { $("#u_check").disabled = true; showUpd("checking"); }
  try { updInfo = canUpdate ? JSON.parse(await call("checkUpdate", !!force)) : await linkCheck(); showUpd(); if (!force) updPopup(); }
  catch (e) { if (force) showUpd("updErr", { e: e.message }); }
  finally { $("#u_check").disabled = false; }
}
// 🎁 small pop-up on app start when a new version exists (once per app start)
let popShown = false;
function updPopup() {
  if (popShown || !updInfo || !updInfo.available) return;
  popShown = true;
  const t = T[L];
  $("#up_t").textContent = fmt(t.popT, { v: updInfo.latestName });
  $("#up_d").textContent = t.popD;
  $("#up_go").textContent = t.popGo; $("#up_later").textContent = t.popLater;
  $("#updpop").hidden = false;
}
$("#up_later").onclick = () => { $("#updpop").hidden = true; };
$("#updpop").onclick = (e) => { if (e.target.id === "updpop") $("#updpop").hidden = true; };
$("#up_go").onclick = () => { $("#updpop").hidden = true; $("#gear").click(); setTimeout(() => $("#u_install").click(), 300); };
window.__updProgress = (p) => {
  $("#u_bar").hidden = false;
  $("#u_bar i").style.width = (p < 0 ? 50 : p) + "%";
  $("#u_msg").textContent = fmt(T[L].downloading, { p: p < 0 ? "…" : p });
};
$("#newver").onclick = () => $("#gear").click();
$("#u_auto").onchange = () => { try { N.setAutoUpdate($("#u_auto").checked); } catch (_) {} };
if (canLink) {
  $("#upd").hidden = false;
  $("#u_check").onclick = () => checkUpd(true);
  // old app: links open outside the app -> the browser downloads the APK, Android installs it
  $("#u_install").onclick = () => { location.href = updInfo.url; };
}
if (canUpdate) {
  $("#upd").hidden = false;
  $("#u_check").onclick = () => checkUpd(true);
  $("#u_install").onclick = async () => {
    $("#u_install").disabled = true;
    try {
      const r = await call("installUpdate", updInfo.url);
      showUpd(r === "need-permission" ? "perm" : "installing");
    } catch (e) { showUpd("updErr", { e: e.message }); }
    finally { $("#u_install").disabled = false; $("#u_bar").hidden = true; }
  };
  $("#u_web").onclick = async () => {
    $("#u_web").disabled = true;
    try { showUpd((await call("refreshWeb")) === "changed" ? "webChanged" : "webSame"); }
    catch (e) { showUpd("updErr", { e: e.message }); }
    finally { $("#u_web").disabled = false; }
  };
}

// ---------- boot ----------
window.arkhasReady = (async () => {
  applyLang();
  try {
    Arkhas.setSynonyms(JSON.parse(await readConfig("synonyms.json")));
    STORES = JSON.parse(await readConfig("stores.json"));
  } catch (e) { $("#out").innerHTML = `<div class="empty">⚠️ config: ${esc(e.message)}</div>`; }
  if (N && N.isBackground && N.isBackground()) return runBackgroundWatch();   // invisible run from the alert job
  const q = new URLSearchParams(location.search).get("q") || (N && N.pendingQuery ? N.pendingQuery() : "");
  if (N && N.pendingView && N.pendingView() === "deals") { window.arkhasOpen("deals"); return; }
  if (q) run(q); else $("#q").focus();
  syncFavCount();
  if (canAlert) { try { const raw = JSON.parse(pref("alerts", "{}") || "{}"); const c = alCfg();
    if (raw.tg && raw.tg.chat !== c.tg.chat) saveAl(c); } catch (_) {} }
  checkUpd(false);   // quiet check (cached 6 h) -> red dot on ⚙️ when a new version exists
})();
</script>
